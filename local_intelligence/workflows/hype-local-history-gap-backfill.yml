name: HYPE Local — Historical Gap Backfill

on:
  workflow_dispatch:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - "research/hype_history_backfill/**"
      - ".github/workflows/hype-local-history-gap-backfill.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: hype-local-history-gap-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r research/hype_quant/requirements.txt
          python -m pip install -r research/hype_local_only/requirements.txt
          python -m py_compile research/hype_history_backfill/run.py research/hype_local_only/train_history.py

      - name: Wait for Frankfurt history relay
        shell: bash
        run: |
          set -euo pipefail
          URL="https://hype-rest-relay.onrender.com/hype-history-page"
          START=1791072000000
          END=1791093600000
          for i in $(seq 1 40); do
            CODE="$(curl -sS -o /tmp/relay.json -w '%{http_code}'               "$URL?kind=funding&start=$START&end=$END&limit=10" || true)"
            if [ "$CODE" = "200" ] && python - <<'PY'
          import json
          x=json.load(open('/tmp/relay.json'))
          raise SystemExit(0 if x.get('ok') is True else 1)
          PY
            then
              cat /tmp/relay.json
              exit 0
            fi
            echo "relay not ready attempt=$i code=$CODE"
            sleep 8
          done
          cat /tmp/relay.json || true
          exit 1

      - name: Download existing 30-day Local archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf history30 history30.zip
          mkdir -p history30
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=local116-HYPE"             --jq '.artifacts | map(select((.expired|not) and .name=="local116-HYPE")) | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "$ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$ID/zip" > history30.zip
          unzip -q history30.zip -d history30
          test -s history30/candidate_snapshots.jsonl.gz

      - name: Backfill mark index OI funding and causal-join snapshots
        run: |
          rm -rf gaps
          python research/hype_history_backfill/run.py             --relay https://hype-rest-relay.onrender.com             --history-dir history30             --output gaps
          test -s gaps/candidate_snapshots_enriched.jsonl.gz
          test -s gaps/manifest.json

      - name: Train baseline and enriched Local-only models
        run: |
          rm -rf compare && mkdir -p compare/baseline compare/enriched
          python -m research.hype_local_only.train_history             --snapshots history30/candidate_snapshots.jsonl.gz             --compact-1m history30/compact_1m.jsonl.gz             --labels-gz history30/labels.json.gz             --model-out compare/baseline/local_only_model.pkl             --memory-out compare/baseline/LOCAL_RELATIONSHIP_MEMORY.json             --report-out compare/baseline/HISTORICAL_TRAINING_REPORT.json
          python -m research.hype_local_only.train_history             --snapshots gaps/candidate_snapshots_enriched.jsonl.gz             --compact-1m history30/compact_1m.jsonl.gz             --labels-gz history30/labels.json.gz             --model-out compare/enriched/local_only_model.pkl             --memory-out compare/enriched/LOCAL_RELATIONSHIP_MEMORY.json             --report-out compare/enriched/HISTORICAL_TRAINING_REPORT.json

      - name: OOS promotion gate
        run: |
          python - <<'PY'
          import json,pickle
          from pathlib import Path
          def load(p):return json.load(open(p))
          b=load("compare/baseline/HISTORICAL_TRAINING_REPORT.json")
          e=load("compare/enriched/HISTORICAL_TRAINING_REPORT.json")
          def f1(m):
              p=m.get("precision");r=m.get("recall")
              return 0.0 if p is None or r is None or p+r<=0 else 2*p*r/(p+r)
          heads=sorted(b["heads"])
          rows=[];bf=[];ef=[]
          worst_drop=0.0
          for h in heads:
              bm=b["heads"][h]["oos"];em=e["heads"][h]["oos"]
              x=f1(bm);y=f1(em);bf.append(x);ef.append(y);worst_drop=max(worst_drop,x-y)
              rows.append({"head":h,"baseline":bm,"enriched":em,"baseline_f1":x,"enriched_f1":y,"delta_f1":y-x})
          bmean=sum(bf)/len(bf);emean=sum(ef)/len(ef)
          historical_candidate_pass=bool(emean>=bmean+0.005 and worst_drop<=0.08)
          promoted=False  # OOS-only evidence cannot authorize live replacement.
          verdict={"promoted":promoted,"historical_candidate_pass":historical_candidate_pass,
                   "reason":"forward evidence and coherent runtime promotion required","baseline_mean_f1":bmean,"enriched_mean_f1":emean,
                   "delta_mean_f1":emean-bmean,"worst_head_f1_drop":worst_drop,"heads":rows,
                   "rule":"historical screen only: mean OOS F1 +0.005; max head drop 0.08; never auto-promote"}
          Path("compare/PROMOTION.json").write_text(json.dumps(verdict,indent=2)+"\n")
          qpath=Path("compare/enriched/local_only_model.pkl")
          with qpath.open("rb") as f:q=pickle.load(f)
          q.history_meta["historical_gap_backfill"]="HYPE-LOCAL-HISTORICAL-GAPS-v1"
          q.history_meta["promotion_gate"]=verdict
          q.save(qpath)
          print("PROMOTION="+json.dumps(verdict,separators=(",",":")))
          PY

      - name: Package enriched pretrain candidate
        run: |
          cp gaps/manifest.json compare/enriched/HISTORICAL_GAP_MANIFEST.json
          cp compare/PROMOTION.json compare/enriched/PROMOTION.json

      - name: Upload historical gap dataset
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-LOCAL-HISTORICAL-GAPS
          path: gaps/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Upload enriched Local pretrain
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-LOCAL-ONLY-ENRICHED-PRETRAIN
          path: compare/enriched/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload OOS comparison
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-LOCAL-HISTORY-GAP-OOS-${{ github.run_id }}
          path: |
            compare/PROMOTION.json
            compare/baseline/HISTORICAL_TRAINING_REPORT.json
            compare/enriched/HISTORICAL_TRAINING_REPORT.json
          retention-days: 90
          compression-level: 6
