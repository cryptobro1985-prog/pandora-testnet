services:
  - type: web
    name: pandora-persistent-live
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/cryptobro1985-prog/pandora-testnet
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pandora-persistent-live-db
          property: connectionString
databases:
  - name: pandora-persistent-live-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
