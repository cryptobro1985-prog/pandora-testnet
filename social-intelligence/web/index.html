<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Instagram Intelligence</title>
<style>
:root{--bg:#09090b;--card:#141419;--line:#2a2a33;--text:#f7f7fb;--muted:#9b9bab;--pink:#ff4d8d;--violet:#8b5cf6;--good:#8df5c8;--bad:#f7b4b4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#22102d 0,#09090b 34%);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Arial}
main{max-width:1080px;margin:auto;padding:20px 14px 70px}.brand{font-size:25px;font-weight:900}.sub{color:var(--muted);margin:5px 0 20px}
.search{display:flex;gap:9px}.search input{flex:1;min-width:0;background:#101014;border:1px solid var(--line);color:#fff;border-radius:15px;padding:15px 16px;font-size:16px}.search button{border:0;border-radius:15px;padding:0 21px;color:white;font-weight:850;background:linear-gradient(135deg,var(--pink),var(--violet))}
.status{margin:12px 0;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{background:rgba(20,20,25,.95);border:1px solid var(--line);border-radius:19px;padding:17px;margin-top:13px}.profile{display:flex;gap:14px;align-items:center}.avatar{width:74px;height:74px;border-radius:50%;object-fit:cover;background:#222}.name{font-size:21px;font-weight:850}.muted{color:var(--muted)}.stats{display:flex;gap:20px;margin-top:14px}.stats b{display:block;font-size:18px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #24242b}.row:first-child{border-top:0}.pill{font-size:11px;background:#24242d;border-radius:99px;padding:4px 8px}.good{color:var(--good)}.warn{color:var(--bad);font-size:12px}.bar{height:6px;background:#272730;border-radius:10px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--violet))}a{color:#c6a7ff}
@media(max-width:720px){.grid{grid-template-columns:1fr}.search{flex-direction:column}.search button{height:49px}.stats{gap:12px;flex-wrap:wrap}}
</style>
</head>
<body><main>
<div class="brand">Instagram Intelligence</div>
<div class="sub">Один профиль → полный отчёт по наблюдаемой публичной активности и связям.</div>
<div class="search"><input id="q" placeholder="@username или https://instagram.com/username"><button id="go">FULL SCAN</button></div>
<div id="status" class="status">Готово к сканированию.</div>
<div id="out"></div>
</main>
<script>
(function(){
const byId=function(x){return document.getElementById(x)};
const esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]})};
const num=function(n){return n==null?"—":new Intl.NumberFormat("ru-RU").format(n)};
const list=function(items,fn,empty){return items&&items.length?items.map(fn).join(""):'<div class="muted">'+(empty||"Нет наблюдаемых данных")+'</div>'};

async function scan(){
  const q=byId("q").value.trim(); if(!q)return;
  byId("status").textContent="Собираю профиль, публикации, комментарии, лайки и связи…";
  byId("out").innerHTML="";
  try{
    const r=await fetch("/api/scan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q,max_posts:30})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.detail||("HTTP "+r.status));
    render(d);
    byId("status").textContent="Сканирование завершено · "+new Date().toLocaleTimeString("ru-RU");
  }catch(e){byId("status").innerHTML='<span class="warn">'+esc(e.message)+'</span>'}
}

function render(d){
  const p=d.profile||{}, rel=d.relationships||[], ch=d.changes||{}, events=d.events||[], posts=d.posts||[];
  const max=Math.max.apply(null,[1].concat(rel.slice(0,20).map(function(x){return x.score||0})));
  let html='';
  html+='<div class="grid">';
  html+='<section class="card"><div class="profile">';
  if(p.profile_picture_url) html+='<img class="avatar" src="'+esc(p.profile_picture_url)+'" onerror="this.style.display=\'none\'">';
  html+='<div><div class="name">'+esc(p.name||p.username||d.username)+'</div><div class="muted">@'+esc(d.username)+'</div></div></div>';
  html+='<div class="stats"><div><b>'+num(p.followers_count)+'</b><span class="muted">followers</span></div><div><b>'+num(p.follows_count)+'</b><span class="muted">following</span></div><div><b>'+num(p.media_count)+'</b><span class="muted">posts</span></div></div><p>'+esc(p.biography||"")+'</p></section>';
  html+='<section class="card"><div class="row"><span>Публикаций собрано</span><b>'+posts.length+'</b></div><div class="row"><span>Событий взаимодействия</span><b>'+events.length+'</b></div><div class="row"><span>Связанных аккаунтов</span><b>'+rel.length+'</b></div><div class="row"><span>Snapshot</span><span class="pill">'+esc((ch.snapshot_at||"").replace("T"," ").slice(0,19))+'</span></div></section></div>';

  html+='<div class="grid"><section class="card"><h3>Кто взаимодействует чаще</h3>';
  html+=list(rel.slice(0,20),function(x,i){
    const width=Math.max(3,(x.score/max)*100);
    return '<div class="row"><div style="flex:1"><b>'+(i+1)+'. @'+esc(x.username)+'</b><div class="muted">комм. '+(x.comments_in||0)+' · лайки '+(x.likes_in||0)+' · упоминания '+(x.mentions_out||0)+'</div><div class="bar"><i style="width:'+width+'%"></i></div></div><b>'+x.score+'</b></div>';
  });
  html+='</section>';

  html+='<section class="card"><h3>Изменения подписок между наблюдениями</h3>';
  html+='<div class="row"><span class="good">Новые подписчики</span><b>'+(ch.followers_observed?((ch.new_followers||[]).length):'UNKNOWN')+'</b></div>';
  html+=list(ch.new_followers,function(x){return '<div class="row"><span>@'+esc(x)+'</span><span class="pill">followed</span></div>'});
  html+='<div class="row"><span class="warn">Отписались</span><b>'+(ch.followers_observed?((ch.lost_followers||[]).length):'UNKNOWN')+'</b></div>';
  html+=list(ch.lost_followers,function(x){return '<div class="row"><span>@'+esc(x)+'</span><span class="pill">unfollowed</span></div>'});
  html+='<div class="row"><span class="good">TARGET подписался</span><b>'+(ch.following_observed?((ch.new_following||[]).length):'UNKNOWN')+'</b></div>';
  html+=list(ch.new_following,function(x){return '<div class="row"><span>@'+esc(x)+'</span><span class="pill">new following</span></div>'});
  html+='<div class="row"><span class="warn">TARGET отписался</span><b>'+(ch.following_observed?((ch.unfollowed||[]).length):'UNKNOWN')+'</b></div>';
  html+=list(ch.unfollowed,function(x){return '<div class="row"><span>@'+esc(x)+'</span><span class="pill">unfollowed</span></div>'});
  html+='</section></div>';

  html+='<section class="card"><h3>Последние наблюдаемые взаимодействия</h3>';
  html+=list(events.slice(0,100),function(e){return '<div class="row"><div><b>@'+esc(e.actor)+'</b><div class="muted">'+esc(e.kind)+' '+esc(e.text||"")+'</div></div>'+(e.url?'<a href="'+esc(e.url)+'" target="_blank">post</a>':'')+'</div>'});
  html+='</section>';

  html+='<section class="card"><h3>Публикации</h3>';
  html+=list(posts.slice(0,30),function(pst){return '<div class="row"><div><b>'+esc((pst.caption||"Публикация").slice(0,90))+'</b><div class="muted">♥ '+num(pst.like_count)+' · 💬 '+num(pst.comments_count)+' · конкретных likers: '+((pst.likers||[]).length)+'</div></div>'+(pst.permalink?'<a href="'+esc(pst.permalink)+'" target="_blank">открыть</a>':'')+'</div>'});
  html+='</section>';

  html+='<section class="card"><h3>Покрытие источников</h3>';
  (d.sources||[]).forEach(function(s){html+='<div class="row"><span>'+esc(s.source)+'</span><b class="'+(s.status==="ok"?"good":"warn")+'">'+esc(s.status)+'</b></div>'});
  (d.warnings||[]).forEach(function(w){html+='<div class="warn">'+esc(w)+'</div>'});
  html+='<p class="muted">UNKNOWN ≠ 0. Если Instagram не отдал список лайкнувших или followers/following, приложение не придумывает данные. Просмотры профиля и история того, какие профили человек открывал, публично не доступны.</p></section>';
  byId("out").innerHTML=html;
}
byId("go").onclick=scan;
byId("q").addEventListener("keydown",function(e){if(e.key==="Enter")scan()});
})();
</script></body></html>
