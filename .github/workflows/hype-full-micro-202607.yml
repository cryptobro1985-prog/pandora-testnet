name: HYPE Dense Full Microstructure Teacher — Jul12-Aug06

on:
  workflow_dispatch:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - ".github/workflows/hype-full-micro-202607.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: hype-full-micro-202607
  # Always prefer the newest corrected producer contract over stale rebuilds.
  cancel-in-progress: true

jobs:
  build-train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      CRYPTOHFTDATA_API_KEY: ${{ secrets.CRYPTOHFTDATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Publish RUNNING marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/hype_full_micro_202607/results
          python - <<'PY'
          import json,os,time,pathlib
          p=pathlib.Path("research/hype_full_micro_202607/results/RUN_STATUS.json")
          json.dump({"status":"RUNNING","run_id":os.getenv("GITHUB_RUN_ID"),"sha":os.getenv("GITHUB_SHA"),"started_ts_ms":int(time.time()*1000)},p.open("w"),indent=2)
          PY
          git config user.name "pandora-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/hype_full_micro_202607/results/RUN_STATUS.json
          git commit -m "research(hype): full-micro teacher RUNNING [skip ci]" || true
          git pull --rebase origin research/hype-h1-local-v5-oi-microstructure-20261104 || true
          git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104 || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy polars pyarrow requests scikit-learn zstandard
          python -m py_compile \
            research/hype_full_micro_202607/build_full_micro.py \
            research/hype_full_micro_202607/build_dense_full_micro.py \
            research/hype_full_micro_202607/train_full_micro.py \
            research/hype_full_micro_202607/train_dense_signature.py \
            research/hype_full_micro_202607/train_retrace_anchor_signature.py \
            research/hype_full_micro_202607/rich_local_relationship_atlas.py \
            research/hype_full_micro_202607/find_low_high_relations.py \
            research/hype_full_micro_202607/test_data_quality.py
          python -m unittest research.hype_full_micro_202607.test_data_quality

      - name: Build complete causal Jul-Aug HYPE dataset
        run: |
          set -euo pipefail
          rm -rf full_micro_out full_micro_cache
          mkdir -p full_micro_out full_micro_cache
          python -m research.hype_full_micro_202607.build_dense_full_micro             --output full_micro_out             --cache full_micro_cache | tee full_micro_build.log
          test -s full_micro_out/candidate_snapshots_full_micro.jsonl.gz
          test -s full_micro_out/compact_1m.jsonl.gz
          test -s full_micro_out/labels.json.gz
          test -s full_micro_out/manifest.json
          rm -rf full_micro_cache

      - name: Audit causal coverage
        run: |
          python - <<'PY'
          import json
          m=json.load(open("full_micro_out/manifest.json"))
          a=json.load(open("full_micro_out/feature_availability.json"))
          print(json.dumps(m,indent=2))
          print(json.dumps(a,indent=2))
          assert m["future_leakage_guard"]
          assert m["raw_files_retained"] is False
          assert m["strict_labels"] > 0
          assert m["snapshots"] > 0
          assert a["points_total"] == 116
          assert a["causal_input_points"] == 86
          PY

      - name: Validate clean microstructure cache
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,json,math
          path="full_micro_out/candidate_snapshots_full_micro.jsonl.gz"
          rows=0
          book_valid=0
          book_crossed_masked=0
          liq_valid={5:0,15:0,60:0,180:0,300:0}
          liq_invalid={5:0,15:0,60:0,180:0,300:0}
          bad=[]
          with gzip.open(path,"rt",encoding="utf-8") as fh:
              for line in fh:
                  if not line.strip():
                      continue
                  r=json.loads(line); rows+=1
                  f=r.get("features") or {}
                  bv=float(f.get("fullmicro_book_valid",0) or 0)
                  crossed=float(f.get("fullmicro_book_crossed",0) or 0)
                  if bv==1.0:
                      book_valid+=1
                      spread=f.get("fullmicro_spread_bps")
                      if spread is None or not math.isfinite(float(spread)) or float(spread)<=0 or crossed==1.0:
                          bad.append(("book",rows,spread,crossed))
                  elif crossed==1.0:
                      book_crossed_masked+=1
                  for sec in (5,15,60,180,300):
                      vk=f"fullmicro_liq_stream_valid_{sec}s"
                      ck=f"fullmicro_liq_count_{sec}s"
                      v=float(f.get(vk,0) or 0)
                      if v==1.0:
                          liq_valid[sec]+=1
                          if ck not in f:
                              bad.append(("liq_valid_missing_count",rows,sec))
                      else:
                          liq_invalid[sec]+=1
                          if ck in f:
                              bad.append(("liq_invalid_encoded_as_zero",rows,sec,f.get(ck)))
          assert rows>0
          assert book_valid>0, "no valid L50 snapshots"
          assert not bad, bad[:20]
          summary={
              "rows":rows,
              "book_valid_rows":book_valid,
              "book_crossed_rows_masked":book_crossed_masked,
              "liq_valid_rows":liq_valid,
              "liq_invalid_rows":liq_invalid,
              "contract":"crossed/locked book masked; missing liquidation source never encoded as real zero; dense swing running-extreme candidates"
          }
          print("CLEAN_MICRO_AUDIT="+json.dumps(summary,separators=(",",":")))
          with open("full_micro_out/CLEAN_MICRO_AUDIT.json","w") as out:
              json.dump(summary,out,indent=2)
          PY

      - name: Upload clean full-micro cache before modeling
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-FULL-MICRO-CLEAN-CACHE-202607-${{ github.run_id }}
          path: |
            full_micro_out/**
            full_micro_build.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Compress build log after clean-cache upload
        run: gzip -9 -f full_micro_build.log

      - name: Find exact-time LOW and HIGH relations
        run: |
          python -m research.hype_full_micro_202607.find_low_high_relations \
            --snapshots full_micro_out/candidate_snapshots_full_micro.jsonl.gz \
            --out full_micro_relations | tee full_micro_relation.log
          test -s full_micro_relations/LOW_HIGH_RELATIONS_LATEST.json
          python - <<'PY'
          import gzip,json
          rows=[]
          with gzip.open("full_micro_out/candidate_snapshots_full_micro.jsonl.gz","rt") as f:
              for line in f:
                  if line.strip():
                      r=json.loads(line)
                      if int(r["delay_s"])==0: rows.append(r)
          keys={k for r in rows for k in (r.get("features") or {})}
          must=[
              "m1_ret_bps","m3_ret_bps","m5_ret_bps","h1_ret_bps",
              "buy_eff_60s","sell_eff_60s",
              "fullmicro_bid_replenish_notional_60s",
              "fullmicro_ask_replenish_notional_60s",
              "fullmicro_bid_absorption_proxy_60s",
              "fullmicro_ask_absorption_proxy_60s",
              "fullmicro_book_churn_notional_60s",
          ]
          missing=[k for k in must if k not in keys]
          assert not missing, f"missing dynamic relation features: {missing}"
          print(json.dumps({"exact_rows":len(rows),"dynamic_feature_assertions":"OK"}))
          PY
          gzip -9 -f full_micro_relation.log

      - name: Mine rich LOW/HIGH relationships across all micro features
        run: |
          python -m research.hype_full_micro_202607.rich_local_relationship_atlas \
            --snapshots full_micro_out/candidate_snapshots_full_micro.jsonl.gz \
            --output full_micro_relations/RICH_LOCAL_RELATIONSHIP_ATLAS.json | tee rich_relationship_atlas.log
          test -s full_micro_relations/RICH_LOCAL_RELATIONSHIP_ATLAS.json
          gzip -9 -f rich_relationship_atlas.log

      - name: Train dense dual-head Local Signature models
        run: |
          python -m research.hype_full_micro_202607.train_dense_signature \
            --snapshots full_micro_out/candidate_snapshots_full_micro.jsonl.gz \
            --labels-gz full_micro_out/labels.json.gz \
            --output full_micro_model | tee full_micro_train.log
          test -s full_micro_model/HYPE_DENSE_FULL_MICRO_DUAL_HEAD.pkl
          test -s full_micro_model/HYPE_DENSE_FULL_MICRO_DUAL_HEAD_REPORT.json
          gzip -9 -f full_micro_train.log

      - name: Rework the historical 0.33-0.35pct retrace Local regime
        run: |
          python -m research.hype_full_micro_202607.train_retrace_anchor_signature \
            --snapshots full_micro_out/candidate_snapshots_full_micro.jsonl.gz \
            --labels-gz full_micro_out/labels.json.gz \
            --output full_micro_retrace | tee full_micro_retrace.log
          test -s full_micro_retrace/HYPE_RETRACE_ANCHORED_RICH_SIGNATURE_REPORT.json
          gzip -9 -f full_micro_retrace.log

      - name: Publish latest report to research branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/hype_full_micro_202607/results
          cp full_micro_out/manifest.json research/hype_full_micro_202607/results/LATEST_MANIFEST.json
          cp full_micro_out/feature_availability.json research/hype_full_micro_202607/results/LATEST_FEATURE_AVAILABILITY.json
          cp full_micro_model/HYPE_DENSE_FULL_MICRO_DUAL_HEAD_REPORT.json research/hype_full_micro_202607/results/LATEST_REPORT.json
          cp full_micro_retrace/HYPE_RETRACE_ANCHORED_RICH_SIGNATURE_REPORT.json research/hype_full_micro_202607/results/RETRACE_ANCHORED_RICH_SIGNATURE_LATEST.json
          cp full_micro_relations/LOW_HIGH_RELATIONS_LATEST.json research/hype_full_micro_202607/results/LOW_HIGH_RELATIONS_LATEST.json
          cp full_micro_relations/RICH_LOCAL_RELATIONSHIP_ATLAS.json research/hype_full_micro_202607/results/RICH_LOCAL_RELATIONSHIP_ATLAS.json
          git config user.name "pandora-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/hype_full_micro_202607/results
          git commit -m "research(hype): publish July-Aug full-micro teacher result [skip ci]" || true
          git pull --rebase origin research/hype-h1-local-v5-oi-microstructure-20261104 || true
          git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104 || true

      - name: Upload compact full-micro dataset
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-FULL-MICRO-202607-DATA-${{ github.run_id }}
          path: |
            full_micro_out/**
            full_micro_relations/**
            full_micro_build.log.gz
            full_micro_relation.log.gz
            rich_relationship_atlas.log.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload trained full-micro model
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-FULL-MICRO-202607-MODEL-${{ github.run_id }}
          path: |
            full_micro_model/**
            full_micro_retrace/**
            full_micro_train.log.gz
            full_micro_retrace.log.gz
          if-no-files-found: error
          retention-days: 60
          compression-level: 9

      - name: Publish final run status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/hype_full_micro_202607/results
          python - <<'PY'
          import json,os,time,pathlib
          ok=pathlib.Path("full_micro_model/HYPE_DENSE_FULL_MICRO_DUAL_HEAD_REPORT.json").exists()
          p=pathlib.Path("research/hype_full_micro_202607/results/RUN_STATUS.json")
          json.dump({"status":"SUCCESS" if ok else "FAILED","run_id":os.getenv("GITHUB_RUN_ID"),"sha":os.getenv("GITHUB_SHA"),"finished_ts_ms":int(time.time()*1000)},p.open("w"),indent=2)
          PY
          git config user.name "pandora-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/hype_full_micro_202607/results/RUN_STATUS.json
          git commit -m "research(hype): full-micro teacher run status [skip ci]" || true
          git pull --rebase origin research/hype-h1-local-v5-oi-microstructure-20261104 || true
          git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104 || true
