name: HYPE Universal Trigger Nov OOS

on:
  push:
    branches: [research/hype-h1-local-v5-oi-microstructure-20261104]
    paths:
      - "research/hype_movement_signature/nov_oos_trigger_check.py"
      - ".github/workflows/hype-universal-trigger-nov-oos.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: hype-universal-trigger-nov-oos
  cancel-in-progress: true

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      RAW_ARTIFACT_ID: "13723739486"
      REPLAY_START: "2026-11-08T00:00:00+00:00"
      REPLAY_END: "2026-11-10T00:00:00+00:00"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas polars pyarrow requests zstandard
      - name: Restore preserved Nov8-10 raw cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw /tmp/cache /tmp/recent
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${RAW_ARTIFACT_ID}/zip" > /tmp/raw.zip
          unzip -q /tmp/raw.zip -d /tmp/raw
          cp -a /tmp/raw/cache/. /tmp/cache/
      - name: Build untouched Nov compact
        run: |
          python -m research.hype_movement_signature.build_recent_compact_from_cache             --start "${REPLAY_START}" --end "${REPLAY_END}"             --cache /tmp/cache --output /tmp/recent/compact_1m.jsonl.gz --workers 32
      - name: Score frozen triggers
        run: |
          rm -rf /tmp/nov_oos
          python -m research.hype_movement_signature.nov_oos_trigger_check             --compact /tmp/recent/compact_1m.jsonl.gz --out /tmp/nov_oos
          cat /tmp/nov_oos/NOV_OOS_TRIGGER_REPORT.json
      - name: Commit OOS result
        run: |
          set -euo pipefail
          git fetch origin research/hype-h1-local-v5-oi-microstructure-20261104
          git reset --hard origin/research/hype-h1-local-v5-oi-microstructure-20261104
          rm -rf research/hype_movement_signature/results_nov_oos_trigger
          mkdir -p research/hype_movement_signature/results_nov_oos_trigger
          cp /tmp/nov_oos/* research/hype_movement_signature/results_nov_oos_trigger/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/hype_movement_signature/results_nov_oos_trigger
          if ! git diff --cached --quiet; then
            git commit -m "research(hype): publish frozen Nov OOS trigger score"
            git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HYPE-UNIVERSAL-TRIGGER-NOV-OOS-${{ github.run_id }}
          path: /tmp/nov_oos/**
          if-no-files-found: warn
          retention-days: 30
