name: HYPE Dual-Scope Live Smoke

on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - ".github/workflows/hype-dual-scope-live-smoke.yml"
      - "research/hype_false_local_entry/**"
      - "research/hype_local_only/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hype-dual-scope-live-smoke
  cancel-in-progress: true

env:
  HYPE_REST_RELAY_URL: "https://hype-rest-relay.onrender.com"
  LOCAL_ONLY_MONITOR_URL: ""

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: |
          python -m pip install -r research/hype_local_v5/requirements-research.txt
          python -m pip install -r research/hype_quant/requirements.txt
      - name: Restore latest canonical checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p local_cp
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=HYPE-LOCAL-ONLY-CHECKPOINT" --jq '.artifacts | map(select((.expired|not) and .name=="HYPE-LOCAL-ONLY-CHECKPOINT")) | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "${ID}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > checkpoint.zip
          unzip -q checkpoint.zip -d local_cp
          test -s local_cp/local_only_model.pkl
          test -s local_cp/LOCAL_RELATIONSHIP_MEMORY.json
          if test -s local_cp/LOCAL_LIVE_LABELS.recent.jsonl.gz; then
            gzip -cd local_cp/LOCAL_LIVE_LABELS.recent.jsonl.gz > local_cp/LOCAL_LIVE_LABELS.jsonl
          else
            : > local_cp/LOCAL_LIVE_LABELS.jsonl
          fi
          if test -s local_cp/LOCAL_EVENTS.recent.jsonl.gz; then
            gzip -cd local_cp/LOCAL_EVENTS.recent.jsonl.gz > local_cp/LOCAL_EVENTS.jsonl
          else
            : > local_cp/LOCAL_EVENTS.jsonl
          fi
      - name: Sanitize legacy checkpoint to terminal teacher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NEED="$(python - <<'PY'
          from pathlib import Path
          from research.hype_local_only.model import LocalOnlyModel
          from research.hype_local_only.migrate_terminal_teacher import already_migrated
          q=LocalOnlyModel.load(Path("local_cp/local_only_model.pkl"))
          print("0" if already_migrated(q) else "1")
          PY
          )"
          if [ "${NEED}" = "1" ]; then
            mkdir -p terminal_clean_history terminal_clean
            ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=local116-HYPE" --jq '.artifacts | map(select((.expired|not) and .name=="local116-HYPE")) | sort_by(.created_at) | reverse | .[0].id // empty')"
            test -n "${ID}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > terminal_clean_history.zip
            unzip -q terminal_clean_history.zip -d terminal_clean_history
            python -m research.hype_local_only.train_history \
              --snapshots terminal_clean_history/candidate_snapshots.jsonl.gz \
              --compact-1m terminal_clean_history/compact_1m.jsonl.gz \
              --labels-gz terminal_clean_history/labels.json.gz \
              --model-out terminal_clean/local_only_model.pkl \
              --memory-out terminal_clean/LOCAL_RELATIONSHIP_MEMORY.json \
              --report-out terminal_clean/HISTORICAL_TRAINING_REPORT.json
            python -m research.hype_local_only.migrate_terminal_teacher \
              --current-model local_cp/local_only_model.pkl \
              --clean-model terminal_clean/local_only_model.pkl \
              --runtime local_cp/local_runtime.pkl \
              --report local_cp/TERMINAL_TEACHER_MIGRATION.json
            cp terminal_clean/LOCAL_RELATIONSHIP_MEMORY.json local_cp/LOCAL_RELATIONSHIP_MEMORY.json
            rm -f local_cp/LIVE_DISCOVERY_RELATIONSHIPS.json
          fi

      - name: Run real capture through upgraded dual-scope daemon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live_capture
          python -m research.hype_local_only.live_daemon --capture-root live_capture --checkpoint-dir local_cp --minutes 2 > local_cp/dual_smoke_daemon.log 2>&1 &
          PID=$!
          set +e
          python research/hype_local_v5/resilient_capture.py --minutes 2 --chunk-minutes 2 --output live_capture > local_cp/dual_smoke_capture.log 2>&1
          CAP=$?
          set -e
          wait "${PID}"
          DAEMON=$?
          echo "capture=${CAP} daemon=${DAEMON}"
          test "${CAP}" -eq 0
          test "${DAEMON}" -eq 0
      - name: Validate migrated checkpoint and dual runtime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research.hype_local_only.model import LocalOnlyModel
          cp=Path("local_cp")
          m=LocalOnlyModel.load(cp/"local_only_model.pkl")
          m._ensure_internal_scope()
          s=json.loads((cp/"LOCAL_ONLY_STATUS.json").read_text())
          assert m.VERSION=="HYPE-LOCAL-ONLY-v2-DUAL-SCOPE"
          assert (m.history_meta.get("terminal_teacher_migration") or {}).get("id")=="TERMINAL_TEACHER_CLEAN_V1"
          assert m.live_labels==0
          assert s["local_target"]=="DUAL_INTERNAL_L3_K1__STRICT_L6_K2"
          assert s["teacher_contract"]["internal"]["name"]=="INTERNAL_L3_K1"
          assert s["teacher_contract"]["strict"]["name"]=="STRICT_L6_K2"
          assert "terminal_finalization" in s["teacher_contract"]
          assert s["research_only"] is True and s["real_orders"] is False
          assert "internal_tactical" in s["model_report"]
          print(json.dumps({
              "status":"PASS",
              "strict_live_labels":m.live_labels,
              "terminal_migration":m.history_meta.get("terminal_teacher_migration"),
              "internal_live_labels":m.internal_live_labels,
              "pending_labels":s.get("pending_labels"),
              "candidate":s.get("candidate"),
              "local_target":s.get("local_target"),
          },ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HYPE-DUAL-SCOPE-LIVE-SMOKE-${{ github.run_id }}
          path: |
            local_cp/LOCAL_ONLY_STATUS.json
            local_cp/dual_smoke_daemon.log
            local_cp/dual_smoke_capture.log
            local_cp/TERMINAL_TEACHER_MIGRATION.json
          if-no-files-found: warn
          retention-days: 3
