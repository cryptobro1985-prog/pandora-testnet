name: HYPE Force Cancel Superseded

on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - ".github/workflows/hype-force-cancel-v7.yml"

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force cancel superseded collector until stopped
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUNS: "42202707649 42202727674"
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            for TARGET_RUN in ${TARGET_RUNS}; do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN}" --jq .status || echo unknown)
            echo "attempt=${attempt} status=${status}"
            if [ "${status}" = "completed" ]; then
              echo "already_completed=${TARGET_RUN}"
              continue
            fi
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN}/cancel" || true
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN}/force-cancel" || true
            sleep 3
          done
          done
          all_done=1
          for TARGET_RUN in ${TARGET_RUNS}; do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN}" --jq .status || echo unknown)
            echo "final_run=${TARGET_RUN} status=${status}"
            [ "${status}" = "completed" ] || all_done=0
          done
          test "${all_done}" = "1"
