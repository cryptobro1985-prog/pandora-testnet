name: HYPE Movement Strength V3 Fast2
on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - '.github/workflows/hype-movement-signature-v3-fast2.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  replay_v3_fast2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 0
      - run: python -m pip install numpy pandas scikit-learn
      - uses: actions/download-artifact@v4
        with:
          name: HYPE-HISTORY-20260712-20261103-MASTER
          path: /tmp/hype_master
          run-id: 42564417286
          github-token: ${{ github.token }}
      - run: |
          rm -rf /tmp/v3fast
          python research/hype_movement_signature/replay_strength_v3_fast.py --master-root /tmp/hype_master --out /tmp/v3fast
          cat /tmp/v3fast/MOVEMENT_V2_REPORT.json || true
          cat /tmp/v3fast/MOVEMENT_V3_FAST_REPORT.json || true
      - run: |
          mkdir -p research/hype_movement_signature/results_v3_fast
          cp /tmp/v3fast/* research/hype_movement_signature/results_v3_fast/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/hype_movement_signature/results_v3_fast
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Score accelerated movement strength V3"
          git pull --rebase origin research/hype-h1-local-v5-oi-microstructure-20261104
          git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104
