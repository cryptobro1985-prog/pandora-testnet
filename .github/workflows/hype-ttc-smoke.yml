name: HYPE TTC Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - "research/hype_false_local_entry/time_to_confirmation_*.py"
      - "research/hype_local_only/forward_first_signal_audit.py"
      - "research/hype_local_only/test_forward_first_signal_scope.py"
      - ".github/workflows/hype-ttc-smoke.yml"

permissions:
  contents: read

jobs:
  ttc-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: TTC syntax and unit tests
        run: |
          python -m py_compile \
            research/hype_false_local_entry/time_to_confirmation_engine.py \
            research/hype_false_local_entry/time_to_confirmation_live.py \
            research/hype_local_only/forward_first_signal_audit.py
          python -m unittest \
            research.hype_false_local_entry.test_time_to_confirmation_engine \
            research.hype_false_local_entry.test_time_to_confirmation_live \
            research.hype_local_only.test_forward_first_signal_scope
