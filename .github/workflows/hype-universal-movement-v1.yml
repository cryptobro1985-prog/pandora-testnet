name: HYPE Universal Movement Signature V1

on:
  push:
    branches: [research/hype-h1-local-v5-oi-microstructure-20261104]
    paths:
      - "research/hype_movement_signature/universal_movement_v1.py"
      - ".github/workflows/hype-universal-movement-v1.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: hype-universal-movement-v1
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research stack
        run: python -m pip install numpy pandas scikit-learn

      - name: Restore five-month historical master
        uses: actions/download-artifact@v4
        with:
          name: HYPE-HISTORY-20260712-20261103-MASTER
          path: /tmp/hype_master
          run-id: 42564417286
          github-token: ${{ github.token }}

      - name: Run local-free universal movement replay
        run: |
          set -euo pipefail
          rm -rf /tmp/universal_movement_v1
          python -m research.hype_movement_signature.universal_movement_v1             --master-root /tmp/hype_master             --out /tmp/universal_movement_v1
          cat /tmp/universal_movement_v1/UNIVERSAL_MOVEMENT_V1_REPORT.json

      - name: Publish result to research branch
        run: |
          set -euo pipefail
          git fetch origin research/hype-h1-local-v5-oi-microstructure-20261104
          git reset --hard origin/research/hype-h1-local-v5-oi-microstructure-20261104
          rm -rf research/hype_movement_signature/results_universal_v1
          mkdir -p research/hype_movement_signature/results_universal_v1
          cp /tmp/universal_movement_v1/* research/hype_movement_signature/results_universal_v1/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/hype_movement_signature/results_universal_v1
          if ! git diff --cached --quiet; then
            git commit -m "research(hype): publish universal movement V1 results"
            git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HYPE-UNIVERSAL-MOVEMENT-V1-${{ github.run_id }}
          path: /tmp/universal_movement_v1/**
          if-no-files-found: warn
          retention-days: 30
