name: Caterpillar 30D Historical Research

on:
  push:
    branches:
      - research/caterpillar-full-research-v2

permissions:
  contents: read

jobs:
  research:
    if: contains(github.event.head_commit.message, '[run-30d]')
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        symbol: [ZEC, HYPE, NEAR, SOL, ENA, 1000PEPE, DOGE, SUI, AAVE, WLD]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: research/caterpillar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run 30-day causal research
        run: |
          mkdir -p "$RUNNER_TEMP/caterpillar-cache" "$RUNNER_TEMP/caterpillar-run"
          python -m caterpillar historical_research \
            --symbols "${{ matrix.symbol }}" \
            --start-date 2026-10-04 \
            --end-date 2026-11-03 \
            --split-date 2026-10-27 \
            --cache "$RUNNER_TEMP/caterpillar-cache" \
            --output "$RUNNER_TEMP/caterpillar-run"
        env:
          PYTHONUNBUFFERED: "1"
      - name: Render final hourly/status report
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/caterpillar-run/research_status.json"; then
            python -m caterpillar hourly_report --latest --output "$RUNNER_TEMP/caterpillar-run" || true
          fi
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caterpillar-30d-${{ matrix.symbol }}
          path: |
            ${{ runner.temp }}/caterpillar-run/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
