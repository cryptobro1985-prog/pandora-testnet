name: HYPE Cortex 20B Smoke

on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - "research/hype_quant/astra_cortex.py"
      - "research/hype_quant/start_local_cortex.sh"
      - ".github/workflows/hype-cortex-20b-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hype-cortex-20b-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CORTEX_PORT: "8081"
      CORTEX_CTX_SIZE: "4096"
      CORTEX_THREADS: "4"
      CORTEX_HF_MODEL: "ggml-org/gpt-oss-20b-GGUF:MXFP4"
      CORTEX_BACKEND: "local_llama"
      CORTEX_LOCAL_URL: "http://127.0.0.1:8081"
      ASTRA_CORTEX_MODEL: "gpt-oss-20b-local"
      ASTRA_CORTEX_REASONING_EFFORT: "high"
    steps:
      - uses: actions/checkout@v4
      - name: Runner capacity
        run: |
          free -h
          df -h /
      - name: Start local gpt-oss-20b
        run: bash research/hype_quant/start_local_cortex.sh
      - name: Verify real local reasoning response
        run: |
          python - <<'PY'
          import json, urllib.request
          schema={
            "type":"object","additionalProperties":False,
            "properties":{
              "decision":{"type":"string","enum":["WAIT","ENTER_LONG","ENTER_SHORT"]},
              "confidence":{"type":"number"},
              "thesis":{"type":"string"}
            },
            "required":["decision","confidence","thesis"]
          }
          payload={
            "model":"gpt-oss-20b-local",
            "reasoning":{"effort":"high"},
            "max_output_tokens":900,
            "input":[
              {"role":"system","content":"Reasoning: high. Analyze internally and return only the required compact JSON final answer."},
              {"role":"user","content":"Market state: confirmed H1 LOW; buy flow positive but price response weak; ask absorption rising; OI rising. Compare LONG SHORT WAIT."}
            ],
            "text":{"format":{"type":"json_schema","name":"smoke_decision","strict":True,"schema":schema}}
          }
          req=urllib.request.Request(
            "http://127.0.0.1:8081/v1/responses",
            data=json.dumps(payload).encode(),
            headers={"Content-Type":"application/json"},
          )
          with urllib.request.urlopen(req,timeout=240) as r:
              obj=json.load(r)
          text=""
          for item in obj.get("output") or []:
              if item.get("type")!="message": continue
              for part in item.get("content") or []:
                  if part.get("type")=="output_text":
                      text=part.get("text") or text
          print("CORTEX20B_SMOKE_RESPONSE="+text[:1200])
          parsed=json.loads(text)
          assert parsed["decision"] in ("WAIT","ENTER_LONG","ENTER_SHORT")
          assert 0 <= float(parsed["confidence"]) <= 1
          print("CORTEX20B_SMOKE=ok")
          PY
      - name: Diagnostics
        if: always()
        run: |
          free -h || true
          df -h / || true
          tail -n 120 /tmp/cortex20b.log || true
