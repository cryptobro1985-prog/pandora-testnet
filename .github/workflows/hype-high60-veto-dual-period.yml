name: HYPE HIGH60 Veto Dual-Period Replay

on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - "research/hype_false_local_entry/high60_retrace_veto.py"
      - "research/hype_false_local_entry/replay_high60_veto_stack.py"
      - ".github/workflows/hype-high60-veto-dual-period.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore Jul-Aug and Oct-Nov
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p octnov julaug
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=local116-HYPE" --jq '.artifacts | map(select((.expired|not) and .name=="local116-HYPE")) | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "$ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > octnov.zip
          unzip -q octnov.zip -d octnov
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/13585701406/zip" > julaug.zip
          unzip -q julaug.zip -d julaug
      - name: Replay frozen HIGH60 veto stack
        run: |
          python -m research.hype_false_local_entry.replay_high60_veto_stack             --compact-1m octnov/compact_1m.jsonl.gz             --labels-gz octnov/labels.json.gz             --output OCTNOV_HIGH60_VETO.json
          python -m research.hype_false_local_entry.replay_high60_veto_stack             --compact-1m julaug/full_micro_out/compact_1m.jsonl.gz             --labels-gz julaug/full_micro_out/labels.json.gz             --derive-internal             --output JULAUG_HIGH60_VETO.json
          python - <<'PY'
          import json
          a=json.load(open("OCTNOV_HIGH60_VETO.json"))
          b=json.load(open("JULAUG_HIGH60_VETO.json"))
          print("OCTNOV",a["evaluation"],a["by_side"]["HIGH"])
          print("JULAUG",b["evaluation"],b["by_side"]["HIGH"])
          ah=a["by_side"]["HIGH"]; bh=b["by_side"]["HIGH"]
          assert bh["precision"]>0.90 and bh["recall"]>=0.42,bh
          assert ah["precision"]>0.96 and ah["recall"]>=0.45,ah
          assert a["contracts"]["high60_veto"]["min_high_retrace_60_bps"]==50.0
          assert b["contracts"]["core_flip_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HYPE-HIGH60-VETO-DUAL-${{ github.run_id }}
          path: |
            OCTNOV_HIGH60_VETO.json
            JULAUG_HIGH60_VETO.json
          retention-days: 14
