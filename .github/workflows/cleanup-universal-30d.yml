name: Cleanup obsolete universal 30d artifacts
on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - ".github/workflows/cleanup-universal-30d.yml"
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only obsolete 10-token 30d artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in 13280425513 13280390384 13279770856 13279730809 13279637097 13279207302 13279128208 13279042657 13278484147 13278474318 13278459161; do
            echo "Deleting artifact $id"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" || true
          done
