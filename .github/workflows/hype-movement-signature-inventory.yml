name: HYPE Movement Signature Inventory

on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - '.github/workflows/hype-movement-signature-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 0

      - name: Download historical master artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/hype_master
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/13650399622/zip > /tmp/hype_master/master.zip
          unzip -q /tmp/hype_master/master.zip -d /tmp/hype_master/unpacked

      - name: Build inventory
        run: |
          python - <<'PY'
          import csv, json, os, pathlib, re, gzip
          root=pathlib.Path('/tmp/hype_master/unpacked')
          out=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file():
                  continue
              rec={'path':str(p.relative_to(root)),'size_bytes':p.stat().st_size,'suffix':p.suffix.lower()}
              try:
                  if p.suffix.lower()=='.csv':
                      with p.open('r',encoding='utf-8',errors='replace',newline='') as f:
                          rd=csv.reader(f)
                          hdr=next(rd,[])
                          rows=[]
                          for _ in range(3):
                              try: rows.append(next(rd))
                              except StopIteration: break
                      rec['columns']=hdr
                      rec['sample_rows']=rows
                  elif p.suffix.lower()=='.jsonl':
                      rows=[]
                      with p.open('r',encoding='utf-8',errors='replace') as f:
                          for _ in range(3):
                              line=f.readline()
                              if not line: break
                              try: rows.append(json.loads(line))
                              except Exception: rows.append(line[:500])
                      rec['sample_rows']=rows
                      if rows and isinstance(rows[0],dict): rec['columns']=list(rows[0].keys())
                  elif p.name.endswith('.jsonl.gz'):
                      rows=[]
                      with gzip.open(p,'rt',encoding='utf-8',errors='replace') as f:
                          for _ in range(3):
                              line=f.readline()
                              if not line: break
                              try: rows.append(json.loads(line))
                              except Exception: rows.append(line[:500])
                      rec['sample_rows']=rows
                      if rows and isinstance(rows[0],dict): rec['columns']=list(rows[0].keys())
                  elif p.suffix.lower()=='.json' and p.stat().st_size<2_000_000:
                      obj=json.loads(p.read_text(encoding='utf-8',errors='replace'))
                      rec['json_type']=type(obj).__name__
                      if isinstance(obj,dict): rec['keys']=list(obj.keys())[:100]
                      elif isinstance(obj,list):
                          rec['length']=len(obj)
                          if obj and isinstance(obj[0],dict): rec['columns']=list(obj[0].keys())
              except Exception as e:
                  rec['inspect_error']=repr(e)
              out.append(rec)
          target=pathlib.Path('research/hype_movement_signature/MASTER_INVENTORY.json')
          target.write_text(json.dumps({'artifact_id':13650399622,'files':out},indent=2),encoding='utf-8')
          print('files',len(out))
          for r in sorted(out,key=lambda x:x['size_bytes'],reverse=True)[:80]:
              print(r['size_bytes'],r['path'],r.get('columns',[])[:30])
          PY

      - name: Commit inventory
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/hype_movement_signature/MASTER_INVENTORY.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Inventory movement-signature historical master"
            git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104
          fi
