name: Options Live Keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Keep research Options signal service awake
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if curl --fail --silent --show-error --max-time 55               https://pandora-options-live-signal.onrender.com/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 10
          done
          exit 1
