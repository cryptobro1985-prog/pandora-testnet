name: HYPE Fin-JEPA 30D research (isolated)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU research dependencies
        run: |
          python -m pip install numpy torch --index-url https://pypi.org/simple
      - name: Recover canonical 30D HYPE dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=local116-HYPE" --jq '.artifacts | map(select((.expired|not) and .name=="local116-HYPE")) | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "$ID" || { echo 'Missing canonical local116-HYPE artifact'; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$ID/zip" > history.zip
          mkdir history
          unzip -q history.zip -d history
          test -s history/candidate_snapshots.jsonl.gz
          test -s history/manifest.json
      - name: Validate explicit 116-feature schema
        run: |
          python - <<'PY'
          import json,pathlib
          m=json.loads(pathlib.Path("history/manifest.json").read_text())
          names=m.get("feature_names")
          if not isinstance(names,list) or len(names)!=116 or len(set(names))!=116:
              raise SystemExit("No canonical ordered 116-feature schema in manifest; refusing to invent feature mapping")
          pathlib.Path("history/feature_names.json").write_text(json.dumps(names))
          PY
      - name: Train and evaluate Fin-JEPA
        run: |
          OMP_NUM_THREADS=4 python -m research.hype_local_only.train_fin_jepa_30d \
            --snapshots history/candidate_snapshots.jsonl.gz \
            --schema history/feature_names.json --output fin_jepa_result --workers 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HYPE-FIN-JEPA-30D-RESEARCH-${{ github.run_id }}
          path: fin_jepa_result/
          if-no-files-found: warn
          retention-days: 30
