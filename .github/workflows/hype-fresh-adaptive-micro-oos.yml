name: HYPE Fresh Adaptive Micro OOS

on:
  push:
    branches: [research/hype-h1-local-v5-oi-microstructure-20261104]
    paths:
      - "research/hype_movement_signature/fresh_adaptive_micro_oos.py"
      - ".github/workflows/hype-fresh-adaptive-micro-oos.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: hype-fresh-adaptive-micro-oos
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CRYPTOHFTDATA_API_KEY: ${{ secrets.CRYPTOHFTDATA_API_KEY }}
      START: "2026-11-10T00:00:00+00:00"
      END: "2026-11-10T18:30:00+00:00"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install numpy pandas polars pyarrow requests zstandard
      - name: Run fresh adaptive micro OOS
        run: |
          set -euo pipefail
          rm -rf /tmp/fresh_micro /tmp/fresh_cache
          mkdir -p /tmp/fresh_micro /tmp/fresh_cache
          python -m research.hype_movement_signature.fresh_adaptive_micro_oos             --start "${START}" --end "${END}"             --cache /tmp/fresh_cache --out /tmp/fresh_micro
          cat /tmp/fresh_micro/FRESH_ADAPTIVE_MICRO_OOS_REPORT.json
      - name: Publish frozen-window result
        run: |
          set -euo pipefail
          git fetch origin research/hype-h1-local-v5-oi-microstructure-20261104
          git reset --hard origin/research/hype-h1-local-v5-oi-microstructure-20261104
          rm -rf research/hype_movement_signature/results_fresh_adaptive_micro
          mkdir -p research/hype_movement_signature/results_fresh_adaptive_micro
          cp /tmp/fresh_micro/* research/hype_movement_signature/results_fresh_adaptive_micro/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/hype_movement_signature/results_fresh_adaptive_micro
          if ! git diff --cached --quiet; then
            git commit -m "research(hype): publish fresh adaptive micro OOS"
            git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HYPE-FRESH-ADAPTIVE-MICRO-OOS-${{ github.run_id }}
          path: /tmp/fresh_micro/**
          if-no-files-found: warn
          retention-days: 30
