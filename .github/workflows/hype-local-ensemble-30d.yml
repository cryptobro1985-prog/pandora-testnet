name: HYPE Local Ensemble 30D — FinJEPA + Quant + LocalOnly

on:
  workflow_dispatch:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - "research/hype_local_only/fin_jepa_adapter.py"
      - "research/hype_local_only/test_fin_jepa_adapter.py"
      - "research/hype_local_only/train_local_ensemble_30d.py"
      - "research/hype_local_only/h1_teacher_context.py"
      - "research/hype_local_only/feature_discovery.py"
      - ".github/workflows/hype-local-ensemble-30d.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: hype-local-ensemble-30d
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish RUNNING marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/hype_local_only/results
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path("research/hype_local_only/results/HYPE_LOCAL_ENSEMBLE_RUN_STATUS.json")
          json.dump({
            "status":"RUNNING",
            "github_run_id":os.environ.get("GITHUB_RUN_ID"),
            "github_sha":os.environ.get("GITHUB_SHA"),
            "started_by":"hype-local-ensemble-30d"
          },p.open("w"),indent=2)
          PY
          git config user.name "pandora-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/hype_local_only/results/HYPE_LOCAL_ENSEMBLE_RUN_STATUS.json
          git commit -m "research(hype): Local ensemble training RUNNING [skip ci]" || true
          git pull --rebase origin research/hype-h1-local-v5-oi-microstructure-20261104 || true
          git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104 || true


      - name: Install research stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy river scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m py_compile research/hype_local_only/fin_jepa_adapter.py research/hype_local_only/h1_teacher_context.py research/hype_local_only/feature_discovery.py research/hype_local_only/train_local_ensemble_30d.py
          python -m unittest research.hype_local_only.test_fin_jepa_adapter -v

      - name: Recover verified 30D dataset and optional enrichment
        id: data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf history30 enriched
          mkdir -p history30 enriched
          BASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=local116-HYPE"             --jq '.artifacts | map(select((.expired|not) and .name=="local116-HYPE")) | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "$BASE_ID" || { echo "canonical local116-HYPE artifact is missing"; exit 2; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$BASE_ID/zip" > history30.zip
          unzip -q history30.zip -d history30
          test -s history30/candidate_snapshots.jsonl.gz
          test -s history30/feature_availability.json
          test -s history30/manifest.json
          echo "base_artifact_id=$BASE_ID" >> "$GITHUB_OUTPUT"

          GAP_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=HYPE-LOCAL-HISTORICAL-GAPS"             --jq '.artifacts | map(select((.expired|not) and .name=="HYPE-LOCAL-HISTORICAL-GAPS")) | sort_by(.created_at) | reverse | .[0].id // empty')"
          SNAP="history30/candidate_snapshots.jsonl.gz"
          if [ -n "$GAP_ID" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$GAP_ID/zip" > enriched.zip
            unzip -q enriched.zip -d enriched
            if test -s enriched/candidate_snapshots_enriched.jsonl.gz; then
              SNAP="enriched/candidate_snapshots_enriched.jsonl.gz"
              echo "using enriched mark/index/OI/funding causal backfill artifact=$GAP_ID"
            fi
          fi
          echo "snapshots=$SNAP" >> "$GITHUB_OUTPUT"
          echo "gap_artifact_id=$GAP_ID" >> "$GITHUB_OUTPUT"

      - name: Audit 116-point contract before fit
        run: |
          python - <<'PY'
          import json
          from research.hype_quant.feature_contract import POINTS,INPUT_IDS,TARGET_IDS,METADATA_IDS
          assert len(POINTS)==116
          assert len(INPUT_IDS)==86
          assert not(INPUT_IDS & TARGET_IDS)
          a=json.load(open("history30/feature_availability.json"))
          assert int(a["contract_points"])==116
          print(json.dumps({
            "contract_points":len(POINTS),
            "causal_inputs":len(INPUT_IDS),
            "targets":len(TARGET_IDS),
            "metadata":len(METADATA_IDS),
            "historically_observed_input_ids":a["observed_historical_input_ids"],
            "historically_unavailable_input_ids":a["unavailable_historical_input_ids"]
          },indent=2))
          PY

      - name: Train 3-expert Local ensemble
        id: train_model
        run: |
          rm -rf ensemble_out
          mkdir -p ensemble_out
          python -m research.hype_local_only.train_local_ensemble_30d             --snapshots "${{ steps.data.outputs.snapshots }}"             --availability history30/feature_availability.json             --compact-1m history30/compact_1m.jsonl.gz             --labels-gz history30/labels.json.gz             --output ensemble_out             --epochs 18             --workers 4
          test -s ensemble_out/HYPE_LOCAL_ENSEMBLE.pt
          test -s ensemble_out/HYPE_LOCAL_FULL30D_TEACHER.pt
          test -s ensemble_out/HYPE_LOCAL_ENSEMBLE_REPORT.json

      - name: Upload immutable trained bundle
        if: steps.train_model.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-LOCAL-ENSEMBLE-30D-${{ github.run_id }}
          path: ensemble_out/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publish latest auditable report to research branch
        if: always()
        env:
          TRAIN_OUTCOME: ${{ steps.train_model.outcome }}
          BASE_ARTIFACT_ID: ${{ steps.data.outputs.base_artifact_id }}
          GAP_ARTIFACT_ID: ${{ steps.data.outputs.gap_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/hype_local_only/results
          if test -s ensemble_out/HYPE_LOCAL_ENSEMBLE_REPORT.json; then
            cp ensemble_out/HYPE_LOCAL_ENSEMBLE_REPORT.json research/hype_local_only/results/HYPE_LOCAL_ENSEMBLE_LATEST.json
          else
            python - <<'PY'
          import json,os
          p="research/hype_local_only/results/HYPE_LOCAL_ENSEMBLE_LATEST.json"
          json.dump({
            "status":"workflow_failed_before_report",
            "train_outcome":os.environ.get("TRAIN_OUTCOME"),
            "github_run_id":os.environ.get("GITHUB_RUN_ID"),
            "base_artifact_id":os.environ.get("BASE_ARTIFACT_ID"),
            "gap_artifact_id":os.environ.get("GAP_ARTIFACT_ID")
          },open(p,"w"),indent=2)
          PY
          fi
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path("research/hype_local_only/results/HYPE_LOCAL_ENSEMBLE_RUN_STATUS.json")
          json.dump({
            "github_run_id":os.environ.get("GITHUB_RUN_ID"),
            "github_sha":os.environ.get("GITHUB_SHA"),
            "train_outcome":os.environ.get("TRAIN_OUTCOME"),
            "base_artifact_id":os.environ.get("BASE_ARTIFACT_ID"),
            "gap_artifact_id":os.environ.get("GAP_ARTIFACT_ID")
          },p.open("w"),indent=2)
          PY
          git config user.name "pandora-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/hype_local_only/results/HYPE_LOCAL_ENSEMBLE_LATEST.json                   research/hype_local_only/results/HYPE_LOCAL_ENSEMBLE_RUN_STATUS.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(hype): publish latest 30D Local ensemble result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin research/hype-h1-local-v5-oi-microstructure-20261104 || true
            git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104 && exit 0
            sleep 3
          done
          exit 1
