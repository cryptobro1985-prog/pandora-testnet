name: HYPE Telegram Monitor Fallback

on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - ".github/workflows/telegram-monitor-fallback.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  switch-telegram-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MINIAPP_URL: "https://br-delicate-cell-b96truj8-hypemonitor.compute.c-7.eu-central-1.aws.neon.tech/"
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.HYPE_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
    steps:
      - name: Verify fallback page
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          code="$(curl -L -sS -D "$headers" -o /tmp/monitor.html -w '%{http_code}' --connect-timeout 10 --max-time 30 "$MINIAPP_URL")"
          echo "fallback_http=$code"
          test "$code" = "200"
          grep -qi '^content-type: text/html' "$headers"
          grep -q "HYPE Local Monitor" /tmp/monitor.html
          echo "FALLBACK_PAGE_OK_HTML"
      - name: Switch Telegram menu button
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ]; then
            echo "MENU_SWITCH_SKIPPED_NO_TOKEN"
            echo "Fallback WebApp is healthy HTML; Telegram menu credential is not stored in Actions."
            exit 0
          fi
          api="https://api.telegram.org/bot${BOT_TOKEN}"
          payload="$(python - <<'PY'
          import json,os
          print(json.dumps({
            "menu_button":{
              "type":"web_app",
              "text":"HYPE Monitor",
              "web_app":{"url":os.environ["MINIAPP_URL"]}
            }
          },separators=(",",":")))
          PY
          )"
          response="$(curl -sS --fail-with-body -X POST "$api/setChatMenuButton" -H 'Content-Type: application/json' --data "$payload")"
          python - <<'PY' "$response"
          import json,sys
          x=json.loads(sys.argv[1])
          assert x.get("ok") is True,x
          print("TELEGRAM_MENU_UPDATED")
          PY
          check="$(curl -sS --fail-with-body "$api/getChatMenuButton")"
          python - <<'PY' "$check"
          import json,os,sys
          x=json.loads(sys.argv[1]); assert x.get("ok") is True,x
          got=((x.get("result") or {}).get("web_app") or {}).get("url")
          assert got==os.environ["MINIAPP_URL"],(got,os.environ["MINIAPP_URL"])
          print("TELEGRAM_MENU_VERIFIED")
          PY
# retrigger fallback 2026-11-09

      - name: Report fallback result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="MONITOR_FALLBACK_RUN status=${JOB_STATUS} sha=${GITHUB_SHA} run=${GITHUB_RUN_ID}"
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/24/comments \
            -d "$(python - <<'PY'
          import json,os
          print(json.dumps({"body": os.environ.get("REPORT_BODY","")}))
          PY
          )"
        env:
          JOB_STATUS: ${{ job.status }}
          GH_TOKEN: ${{ github.token }}
          REPORT_BODY: "MONITOR_FALLBACK_RUN status=${{ job.status }} sha=${{ github.sha }} run=${{ github.run_id }}"
