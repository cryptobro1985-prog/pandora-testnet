name: HYPE 24H LOW Signature Replay
on:
  push:
    branches: [research/hype-h1-local-v5-oi-microstructure-20261104]
    paths: [".github/workflows/hype-24h-low-signature-replay.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install polars pyarrow numpy
      - name: restore raw
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p raw out
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/13723739486/zip" > raw.zip
          unzip -q raw.zip -d raw
      - name: replay low candidates
        run: |
          python - <<'PY'
          import glob,json,bisect,math
          from pathlib import Path
          from datetime import datetime,timezone
          import polars as pl
          import numpy as np

          START=1794182400000  # Nov 9 00:00 UTC
          STOP =1794268800000  # Nov10 00:00 UTC
          AGES=(60,180,300)
          def iso(t): return datetime.fromtimestamp(t/1000,timezone.utc).isoformat().replace("+00:00","Z")
          def read(kind):
              out=[]
              for p in sorted(glob.glob(f"raw/cache/20261109_*_{kind}.parquet")):
                  out.extend(pl.read_parquet(p).to_dicts())
              return out
          def f(v):
              try:return float(v)
              except:return None
          def tms(r,*keys):
              for k in keys:
                  if r.get(k) is not None:return int(r[k])
              return None

          tr=read("trades")
          trades=[]
          for r in tr:
              t=tms(r,"trade_time","event_time")
              px=f(r.get("price"));q=f(r.get("quantity"))
              if t is None or px is None or q is None or not START<=t<STOP:continue
              # Binance public trades: buyer-maker=True => taker/aggressor SELL.
              side="SELL" if bool(r.get("is_buyer_maker")) else "BUY"
              trades.append((t,px,q,px*q,side))
          trades.sort()
          ts=[x[0] for x in trades]; prices=[x[1] for x in trades]

          liqs=[]
          for r in read("liquidations"):
              t=tms(r,"trade_time","event_time")
              px=f(r.get("average_price")) or f(r.get("price"));q=f(r.get("filled_quantity")) or f(r.get("quantity"))
              if t and px and q and START<=t<STOP:
                  # Force-order SELL closes a long; BUY closes a short.
                  liqs.append((t,px*q,str(r.get("side") or "").upper()))
          liqs.sort()

          oi=[]
          for r in read("open_interest"):
              t=tms(r,"timestamp")
              v=f(r.get("sum_open_interest"));val=f(r.get("sum_open_interest_value"))
              if t and v is not None and START<=t<STOP:oi.append((t,v,val))
          oi.sort(); oi_ts=[x[0] for x in oi]

          # Reconstruct L50 order book and retain timestamped imbalance snapshots.
          ob=read("orderbook")
          ob.sort(key=lambda r:(int(r.get("event_time") or 0), int(r.get("received_time") or 0)))
          bids={};asks={};samples=[]; cur_event=None; group=[]
          def flush(group):
              nonlocal bids,asks,samples
              if not group:return
              et=int(group[0].get("event_time") or 0);typ=str(group[0].get("event_type") or "")
              if typ=="snapshot": bids={};asks={}
              for r in group:
                  side=str(r.get("side") or "").lower();px=f(r.get("price"));q=f(r.get("quantity"))
                  if px is None or q is None:continue
                  book=bids if side=="bid" else asks if side=="ask" else None
                  if book is None:continue
                  if q<=0:book.pop(px,None)
                  else:book[px]=q
              if bids and asks:
                  bp=sorted(bids,reverse=True)[:50];ap=sorted(asks)[:50]
                  def imb(n):
                      bn=sum(p*bids[p] for p in bp[:n]);an=sum(p*asks[p] for p in ap[:n])
                      return (bn-an)/(bn+an) if bn+an>0 else None
                  samples.append((et,imb(10),imb(50),max(bp),min(ap)))
          for r in ob:
              et=int(r.get("event_time") or 0)
              if et!=cur_event:
                  flush(group);group=[r];cur_event=et
              else:group.append(r)
          flush(group)
          samples=[s for s in samples if START-600000<=s[0]<STOP]
          book_ts=[s[0] for s in samples]

          def price_at(t):
              i=bisect.bisect_right(ts,t)-1
              return trades[i][1] if i>=0 else None
          def trade_window(a,b):
              i=bisect.bisect_right(ts,a);j=bisect.bisect_right(ts,b)
              q=trades[i:j]
              buy=sum(x[3] for x in q if x[4]=="BUY");sell=sum(x[3] for x in q if x[4]=="SELL")
              den=buy+sell
              p0=price_at(a);p1=price_at(b)
              ret=(p1/p0-1) if p0 and p1 else None
              return {"count":len(q),"buy":buy,"sell":sell,
                      "imbalance":(buy-sell)/den if den>0 else None,
                      "ret":ret,
                      "buy_eff":max(ret or 0,0)/buy*1e6 if buy>0 and ret is not None else None,
                      "sell_eff":max(-(ret or 0),0)/sell*1e6 if sell>0 and ret is not None else None}
          def liq_window(a,b):
              q=[x for x in liqs if a<x[0]<=b]
              return {"long":sum(x[1] for x in q if x[2]=="SELL"),
                      "short":sum(x[1] for x in q if x[2]=="BUY"),"count":len(q)}
          def oi_at(t):
              i=bisect.bisect_right(oi_ts,t)-1
              return oi[i] if i>=0 else None
          def book_at(t):
              i=bisect.bisect_right(book_ts,t)-1
              return samples[i] if i>=0 else None

          # Every new running low in the active Nov 9 down-leg is a candidate.
          # Deduplicate tiny same-second prints; keep stricter replacements only.
          candidates=[];run_low=float("inf");last_t=None
          for t,px,q,n,side in trades:
              if px<run_low-1e-12:
                  run_low=px
                  if candidates and t-candidates[-1]["ts_ms"]<1000:
                      candidates[-1]={"ts_ms":t,"price":px}
                  else:candidates.append({"ts_ms":t,"price":px})
          # Focus on the final downside leg around the known terminal low; retain
          # material candidate replacements from 07:30 onward plus exact terminal.
          candidates=[c for c in candidates if c["ts_ms"]>=1794209400000]
          # Materialize only >=3 bps improvements to avoid micro-noise.
          mat=[];lp=None
          for c in candidates:
              if lp is None or (lp/c["price"]-1)*10000>=3:
                  mat.append(c);lp=c["price"]
              elif c["price"]<lp:
                  # always keep terminal/newest strict low, replacing last micro-step
                  if mat and c["ts_ms"]-mat[-1]["ts_ms"]<30000:mat[-1]=c
                  lp=c["price"]
          candidates=mat

          results=[]
          for idx,c in enumerate(candidates):
              next_lower=next((z for z in candidates[idx+1:] if z["price"]<c["price"]),None)
              basebook=book_at(c["ts_ms"]);baseoi=oi_at(c["ts_ms"])
              pre=trade_window(c["ts_ms"]-180*60*1000,c["ts_ms"])
              checkpoints=[]
              for age in AGES:
                  t=c["ts_ms"]+age*1000
                  invalid=bool(next_lower and next_lower["ts_ms"]<=t)
                  mark=price_at(t)
                  if mark is None:continue
                  w={sec:trade_window(t-sec*1000,t) for sec in (30,60,180,300)}
                  liq0=liq_window(c["ts_ms"],min(t,c["ts_ms"]+60000))
                  liqlast=liq_window(max(c["ts_ms"],t-60000),t)
                  bk=book_at(t);o=oi_at(t)
                  retr=(mark/c["price"]-1)*100
                  b10=(bk[1]-basebook[1]) if bk and basebook and bk[1] is not None and basebook[1] is not None else None
                  b50=(bk[2]-basebook[2]) if bk and basebook and bk[2] is not None and basebook[2] is not None else None
                  oid=(o[1]/baseoi[1]-1) if o and baseoi and baseoi[1] else None
                  # Core causal chain discovered historically.
                  survival=not invalid
                  response=(retr>0 and (w[60]["ret"] or 0)>0)
                  trajectory=(w[60]["ret"] is not None and w[180]["ret"] is not None and
                              w[60]["ret"]>0 and w[180]["ret"]>0)
                  eff=(w[60]["buy_eff"] is not None and w[60]["sell_eff"] is not None and
                       w[60]["buy_eff"]>w[60]["sell_eff"])
                  flow=(w[60]["imbalance"] is not None and w[60]["imbalance"]>0)
                  liq_decay=None
                  if liq0["long"]>0:
                      liq_decay=liqlast["long"] < liq0["long"]
                  bookrec=(b10 is not None and b50 is not None and b10>0 and b50>0)
                  # OI is context: supportive if price has reversed while OI is stable/rising,
                  # or falling OI accompanies liquidation exhaustion. Do not use as mandatory gate.
                  oi_context=("RISING" if oid is not None and oid>0 else "FALLING" if oid is not None and oid<0 else "FLAT_OR_MISSING")
                  core={"survival":survival,"price_response":response,"trajectory":trajectory,
                        "efficiency_transfer":eff,"flow_transition":flow,
                        "liquidation_exhaustion":liq_decay,"book_recovery":bookrec}
                  available=[v for v in core.values() if v is not None]
                  all_core=bool(available) and all(available) and len(available)>=6
                  checkpoints.append({
                    "age_s":age,"ts_ms":t,"ts":iso(t),"mark":mark,"retrace_pct":retr,
                    "flow_60s":w[60]["imbalance"],"buy_eff_60s":w[60]["buy_eff"],"sell_eff_60s":w[60]["sell_eff"],
                    "ret_60s_pct":(w[60]["ret"]*100 if w[60]["ret"] is not None else None),
                    "ret_180s_pct":(w[180]["ret"]*100 if w[180]["ret"] is not None else None),
                    "ret_300s_pct":(w[300]["ret"]*100 if w[300]["ret"] is not None else None),
                    "long_liq_first60":liq0["long"],"long_liq_last60":liqlast["long"],
                    "book_l10_delta":b10,"book_l50_delta":b50,"oi_delta":oid,"oi_context":oi_context,
                    "pre180_ret_pct":(pre["ret"]*100 if pre["ret"] is not None else None),
                    "core":core,"all_core_chain":all_core
                  })
              first=next((x for x in checkpoints if x["all_core_chain"]),None)
              results.append({"candidate_ts_ms":c["ts_ms"],"candidate_ts":iso(c["ts_ms"]),"price":c["price"],
                              "next_lower":next_lower,"checkpoints":checkpoints,"first_core_confirmation":first})

          terminal=min(candidates,key=lambda x:x["price"]) if candidates else None
          doc={"window":["2026-11-09T00:00:00Z","2026-11-10T00:00:00Z"],
               "active_side":"LOW","candidate_count":len(candidates),"terminal_low":terminal,
               "results":results,
               "historical_reference":{"true_low_60s_reversal_return_pct":[0.1344,0.1412],
                 "false_low_60s_reversal_return_pct":[0.0396,0.0687],
                 "true_low_60s_reversal_efficiency":[0.00855,0.01275],
                 "false_low_60s_reversal_efficiency":[0.00324,0.00783]},
               "note":"Core-chain gate uses sign/state transitions only; OI is context, not mandatory. No future terminal label is used to form checkpoint metrics."}
          Path("out/HYPE_24H_LOW_SIGNATURE_REPLAY.json").write_text(json.dumps(doc,indent=2,ensure_ascii=False))
          print(json.dumps(doc,indent=2,ensure_ascii=False)[:50000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HYPE-24H-LOW-SIGNATURE-REPLAY
          path: out/HYPE_24H_LOW_SIGNATURE_REPLAY.json
          retention-days: 7
