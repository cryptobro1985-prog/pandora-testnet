name: HYPE 24H LOW Signature Replay

on:
  push:
    branches: [research/hype-h1-local-v5-oi-microstructure-20261104]
    paths: [".github/workflows/hype-24h-low-signature-replay.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install polars pyarrow
      - name: Restore raw
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p raw out
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/13723739486/zip" > raw.zip
          unzip -q raw.zip -d raw
      - name: Replay all LOW candidates
        run: |
          python - <<'PY'
          import glob,json,bisect,math
          from pathlib import Path
          from datetime import datetime,timezone
          import polars as pl

          START=1794182400000
          STOP =1794268800000
          AGES=(60,180,300)
          def iso(t): return datetime.fromtimestamp(t/1000,timezone.utc).isoformat().replace("+00:00","Z")
          def fv(v):
              try:return float(v)
              except:return None

          # 1) Stream trades, build full causal tape and every new running LOW.
          trades=[]
          for p in sorted(glob.glob("raw/cache/20261109_*_trades.parquet")):
              d=pl.read_parquet(p).select(["trade_time","price","quantity","is_buyer_maker"])
              for t,ps,qs,bm in d.iter_rows():
                  t=int(t); px=fv(ps); q=fv(qs)
                  if px is None or q is None or not START<=t<STOP: continue
                  side="SELL" if bool(bm) else "BUY"
                  trades.append((t,px,px*q,side))
          trades.sort()
          tarr=[x[0] for x in trades]
          def price_at(t):
              i=bisect.bisect_right(tarr,t)-1
              return trades[i][1] if i>=0 else None
          def tw(a,b):
              i=bisect.bisect_right(tarr,a);j=bisect.bisect_right(tarr,b)
              q=trades[i:j]
              buy=sum(x[2] for x in q if x[3]=="BUY");sell=sum(x[2] for x in q if x[3]=="SELL")
              den=buy+sell;p0=price_at(a);p1=price_at(b)
              ret=(p1/p0-1.0) if p0 and p1 else None
              return {"buy":buy,"sell":sell,"imb":((buy-sell)/den if den else None),"ret":ret,
                      "buy_eff":(max(ret,0)*1e6/buy if ret is not None and buy>0 else None),
                      "sell_eff":(max(-ret,0)*1e6/sell if ret is not None and sell>0 else None)}

          candidates=[]; running=float("inf")
          for t,px,_,_ in trades:
              if px<running:
                  running=px
                  # collapse microsteps inside 15 sec; keep latest/lower print
                  if candidates and t-candidates[-1]["ts"]<15000:
                      candidates[-1]={"ts":t,"price":px}
                  else:
                      candidates.append({"ts":t,"price":px})

          # focus on the actual active down-leg preceding terminal 72.391
          # start after the 78.133 structural high and retain materially lower candidates.
          LEG_START=1794134433000
          candidates=[c for c in candidates if c["ts"]>=LEG_START]
          material=[]; anchor=None
          for c in candidates:
              if anchor is None or (anchor/c["price"]-1)*10000>=2.0:
                  material.append(c);anchor=c["price"]
              elif c["price"]<anchor:
                  # preserve the final strict minimum even when improvement is small
                  if material and c["ts"]-material[-1]["ts"]<60000: material[-1]=c
                  anchor=c["price"]
          candidates=material

          # 2) Liquidations/OI streamed into compact arrays.
          liqs=[]
          for p in sorted(glob.glob("raw/cache/20261109_*_liquidations.parquet")):
              d=pl.read_parquet(p)
              for r in d.iter_rows(named=True):
                  t=int(r.get("trade_time") or r.get("event_time") or 0)
                  px=fv(r.get("average_price")) or fv(r.get("price"))
                  q=fv(r.get("filled_quantity")) or fv(r.get("quantity"))
                  if t and px and q and START<=t<STOP:
                      liqs.append((t,px*q,str(r.get("side") or "").upper()))
          liqs.sort()
          def lw(a,b):
              q=[x for x in liqs if a<x[0]<=b]
              return {"long":sum(x[1] for x in q if x[2]=="SELL"),
                      "short":sum(x[1] for x in q if x[2]=="BUY")}

          oi=[]
          for p in sorted(glob.glob("raw/cache/20261109_*_open_interest.parquet")):
              d=pl.read_parquet(p).select(["timestamp","sum_open_interest"])
              for t,v in d.iter_rows():
                  t=int(t);v=fv(v)
                  if v is not None and START<=t<STOP:oi.append((t,v))
          oi.sort();oi_t=[x[0] for x in oi]
          def oi_at(t):
              i=bisect.bisect_right(oi_t,t)-1
              return oi[i][1] if i>=0 else None

          # 3) Determine only book timestamps we actually need, then stream L50.
          targets=set()
          for c in candidates:
              targets.add(c["ts"])
              for a in AGES:targets.add(c["ts"]+a*1000)
          targets=sorted(t for t in targets if START<=t<STOP)
          book_states={}
          bids={};asks={};ti=0
          for p in sorted(glob.glob("raw/cache/20261109_*_orderbook.parquet")):
              d=pl.read_parquet(p).sort(["event_time","received_time"])
              current=None; group=[]
              def process(gr):
                  global ti,bids,asks
                  if not gr:return
                  et=int(gr[0]["event_time"])
                  typ=str(gr[0].get("event_type") or "")
                  if typ=="snapshot":bids.clear();asks.clear()
                  for r in gr:
                      px=fv(r.get("price"));q=fv(r.get("quantity"))
                      if px is None or q is None:continue
                      side=str(r.get("side") or "").lower()
                      book=bids if side=="bid" else asks if side=="ask" else None
                      if book is None:continue
                      if q<=0:book.pop(px,None)
                      else:book[px]=q
                  while ti<len(targets) and targets[ti]<=et:
                      if bids and asks:
                          bp=sorted(bids,reverse=True)[:50];ap=sorted(asks)[:50]
                          def imb(n):
                              bn=sum(x*bids[x] for x in bp[:n]);an=sum(x*asks[x] for x in ap[:n])
                              return (bn-an)/(bn+an) if bn+an else None
                          book_states[targets[ti]]={"l10":imb(10),"l50":imb(50)}
                      ti+=1
              for r in d.iter_rows(named=True):
                  et=int(r["event_time"])
                  if current is None:current=et
                  if et!=current:
                      process(group);group=[r];current=et
                  else:group.append(r)
              process(group)
          # fill last known book state backward-safe if exact target missed
          known=sorted(book_states)
          def book_at(t):
              i=bisect.bisect_right(known,t)-1
              return book_states[known[i]] if i>=0 else None

          # 4) Score each candidate with the same causal signature dimensions.
          rows=[]
          for idx,c in enumerate(candidates):
              nextlower=next((z for z in candidates[idx+1:] if z["price"]<c["price"]),None)
              b0=book_at(c["ts"]);o0=oi_at(c["ts"])
              checks=[]
              for age in AGES:
                  t=c["ts"]+age*1000
                  if t>=STOP:continue
                  mark=price_at(t);w60=tw(t-60000,t);w180=tw(t-180000,t);w300=tw(t-300000,t)
                  b=book_at(t);ot=oi_at(t)
                  firstliq=lw(c["ts"],min(c["ts"]+60000,t))
                  lastliq=lw(max(c["ts"],t-60000),t)
                  retr=(mark/c["price"]-1)*100 if mark else None
                  survival=not(nextlower and nextlower["ts"]<=t)
                  response=bool(retr is not None and retr>0 and (w60["ret"] or 0)>0)
                  trajectory=bool(w60["ret"] is not None and w180["ret"] is not None and w60["ret"]>0 and w180["ret"]>0)
                  eff=bool(w60["buy_eff"] is not None and w60["sell_eff"] is not None and w60["buy_eff"]>w60["sell_eff"])
                  flow=bool(w60["imb"] is not None and w60["imb"]>0)
                  liq=None if firstliq["long"]<=0 else bool(lastliq["long"]<firstliq["long"])
                  b10=(b["l10"]-b0["l10"]) if b and b0 and b["l10"] is not None and b0["l10"] is not None else None
                  b50=(b["l50"]-b0["l50"]) if b and b0 and b["l50"] is not None and b0["l50"] is not None else None
                  book=bool(b10 is not None and b50 is not None and b10>0 and b50>0)
                  core={"survival":survival,"price_response":response,"trajectory":trajectory,
                        "efficiency_transfer":eff,"flow_transition":flow,
                        "liquidation_exhaustion":liq,"book_recovery":book}
                  avail=[v for v in core.values() if v is not None]
                  passed=sum(v is True for v in avail)
                  # Require all observed core dimensions except liquidation may be unavailable.
                  actionable=(len(avail)>=6 and passed==len(avail))
                  checks.append({"age_s":age,"ts":iso(t),"price":mark,"retrace_pct":retr,
                                 "ret60_pct":(w60["ret"]*100 if w60["ret"] is not None else None),
                                 "ret180_pct":(w180["ret"]*100 if w180["ret"] is not None else None),
                                 "ret300_pct":(w300["ret"]*100 if w300["ret"] is not None else None),
                                 "flow60":w60["imb"],"buy_eff60":w60["buy_eff"],"sell_eff60":w60["sell_eff"],
                                 "book_l10_delta":b10,"book_l50_delta":b50,
                                 "long_liq_first60":firstliq["long"],"long_liq_last60":lastliq["long"],
                                 "oi_delta":((ot/o0-1) if ot and o0 else None),
                                 "core":core,"actionable":actionable})
              first=next((x for x in checks if x["actionable"]),None)
              rows.append({"candidate_ts":iso(c["ts"]),"candidate_ts_ms":c["ts"],"price":c["price"],
                           "invalidated_by":({"ts":iso(nextlower["ts"]),"price":nextlower["price"]} if nextlower else None),
                           "first_actionable":first,"checks":checks})

          terminal=min(candidates,key=lambda x:x["price"]) if candidates else None
          false_entries=[r for r in rows if r["first_actionable"] and terminal and abs(r["price"]-terminal["price"])>1e-9]
          doc={"window":["2026-11-09T00:00:00Z","2026-11-10T00:00:00Z"],
               "candidate_count":len(candidates),
               "terminal_low":({"ts":iso(terminal["ts"]),"price":terminal["price"]} if terminal else None),
               "false_actionable_entries":false_entries,
               "false_actionable_count":len(false_entries),
               "results":rows,
               "note":"Causal replay: no future label enters checkpoint features. A candidate is actionable only when every observed core signature dimension passes; liquidation may be unavailable because the raw archive has missing liquidation hours."}
          Path("out/HYPE_24H_LOW_SIGNATURE_REPLAY.json").write_text(json.dumps(doc,indent=2,ensure_ascii=False))
          print(json.dumps({"candidate_count":doc["candidate_count"],"terminal_low":doc["terminal_low"],
                            "false_actionable_count":doc["false_actionable_count"],
                            "false_actionable_entries":[{"candidate_ts":x["candidate_ts"],"price":x["price"],"first":x["first_actionable"]} for x in false_entries],
                            "terminal_result":next((x for x in rows if terminal and x["price"]==terminal["price"]),None)},indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HYPE-24H-LOW-SIGNATURE-REPLAY
          path: out/HYPE_24H_LOW_SIGNATURE_REPLAY.json
          retention-days: 7
