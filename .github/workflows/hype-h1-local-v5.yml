name: HYPE H1 Local v5 OI Microstructure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hype-local-v5-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[hype-replay-existing]') }}
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish observable start status through the results branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.hype_local_v5.ci_publish --stage started --output ci-status

  code_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run causal engine, data, evaluation and acquisition regressions
        run: |
          python -m pip install -r research/hype_local_v5/requirements-research.txt
          python -m unittest discover -s research/hype_local_v5/tests -v

  recover_artifacts:
    needs: code_checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse the six raw-derived parts from the completed collection run
        if: ${{ contains(github.event.head_commit.message, '[hype-replay-existing]') }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41857510274
          pattern: HYPE-H1-LOCAL-V5-MICRO5S-*
          path: recovered/micro5s
          merge-multiple: true
      - name: Reuse the original artifacts recovered in that run
        if: ${{ contains(github.event.head_commit.message, '[hype-replay-existing]') }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41857510274
          name: HYPE-H1-LOCAL-V5-RECOVERED
          path: recovered/original
      - name: Reuse the recent forward capture when that artifact exists
        if: ${{ contains(github.event.head_commit.message, '[hype-replay-existing]') }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41857510274
          name: HYPE-H1-LOCAL-V5-LIVE-MICROSTRUCTURE
          path: recovered/recent_live
      - name: Check whether the original minute archive was recovered
        id: recovered_minute
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          # This checks presence only. ci_run validates content and coverage before
          # choosing any source; a filename alone is never evidence of readiness.
          present = any(p.is_file() and p.stat().st_size > 0
                        for p in Path('recovered').rglob('HYPE_minutes.csv.gz'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('present=' + str(present).lower() + '\n')
          PY
      - name: Recover original artifacts with the runner's existing GitHub token
        id: recover
        if: ${{ steps.recovered_minute.outputs.present != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.hype_local_v5.acquire --source artifacts --fetch --output recovered/refetched
      - name: Preserve recovery evidence, including unavailable artifact diagnoses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-H1-LOCAL-V5-RECOVERED
          path: recovered
          if-no-files-found: warn
          retention-days: 7

  historical_ticks:
    # The replay marker uses the genuine raw-derived 5s path below, avoiding
    # duplicate downloads just to regenerate the existing minute aggregates.
    if: ${{ !contains(github.event.head_commit.message, '[hype-replay') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chunk:
          - "2026-10-04:2026-10-08"
          - "2026-10-09:2026-10-13"
          - "2026-10-14:2026-10-18"
          - "2026-10-19:2026-10-23"
          - "2026-10-24:2026-10-28"
          - "2026-10-29:2026-11-02"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Aggregate raw Bybit trades
        shell: bash
        run: |
          START="${{ matrix.chunk }}"
          START="${START%%:*}"
          END="${{ matrix.chunk }}"
          END="${END##*:}"
          python research/hype_local_v5/research.py             --mode historical_ticks             --start "$START"             --end "$END"             --output "out/ticks_${START}_${END}"
      - uses: actions/upload-artifact@v4
        with:
          name: HYPE-H1-LOCAL-V5-TICKS-${{ strategy.job-index }}
          path: out/ticks_*
          if-no-files-found: warn


  historical_micro5s:
    needs: code_checks
    if: ${{ !contains(github.event.head_commit.message, '[hype-replay-existing]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chunk:
          - "2026-10-04:2026-10-08"
          - "2026-10-09:2026-10-13"
          - "2026-10-14:2026-10-18"
          - "2026-10-19:2026-10-23"
          - "2026-10-24:2026-10-28"
          - "2026-10-29:2026-11-02"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r research/hype_local_v5/requirements-research.txt
      - name: Aggregate raw trades to 5-second microstructure
        shell: bash
        run: |
          START="${{ matrix.chunk }}"
          START="${START%%:*}"
          END="${{ matrix.chunk }}"
          END="${END##*:}"
          python research/hype_local_v5/micro.py \
            --start "$START" \
            --end "$END" \
            --output "out/micro_${START}_${END}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HYPE-H1-LOCAL-V5-MICRO5S-${{ strategy.job-index }}
          path: out/micro_*
          if-no-files-found: error

  live_microstructure:
    needs: code_checks
    if: ${{ !contains(github.event.head_commit.message, '[hype-replay-existing]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r research/hype_local_v5/requirements-research.txt
      - name: Capture live HYPE orderbook + trades + liquidations + ticker OI
        run: |
          python research/hype_local_v5/research.py             --mode live             --minutes 20             --output out/live_microstructure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HYPE-H1-LOCAL-V5-LIVE-MICROSTRUCTURE
          path: out/live_microstructure
          if-no-files-found: error

  causal_replay:
    needs: [code_checks, recover_artifacts, historical_micro5s]
    if: ${{ always() && needs.code_checks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download fresh raw-derived microstructure parts
        if: ${{ needs.historical_micro5s.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: HYPE-H1-LOCAL-V5-MICRO5S-*
          path: inputs
          merge-multiple: true
      - name: Download recovered original inputs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: HYPE-H1-LOCAL-V5-RECOVERED
          path: recovered
      - name: Run discovery, sealed OOS, ablation and provenance checks
        id: replay
        continue-on-error: true
        run: >-
          python -m research.hype_local_v5.ci_run
          --bars-glob 'inputs/**/HYPE_micro5s_*.csv.gz'
          --recovered recovered --output study
      - name: Preserve complete replay outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-H1-LOCAL-V5-CAUSAL-STUDY
          path: study
          if-no-files-found: error
          retention-days: 14
      - name: Publish replay results or diagnosed failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.hype_local_v5.ci_publish --stage replay --output ci-status --reports study
      - name: Preserve the replay command's failure status
        if: ${{ steps.replay.outcome != 'success' }}
        run: exit 1

  finalize:
    needs: [announce, code_checks, recover_artifacts, historical_micro5s, causal_replay, live_microstructure]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download study, when produced
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: HYPE-H1-LOCAL-V5-CAUSAL-STUDY
          path: study
      - name: Download fresh forward observations, when produced
        if: ${{ needs.live_microstructure.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: HYPE-H1-LOCAL-V5-LIVE-MICROSTRUCTURE
          path: recovered/fresh_live
      - name: Download original observations, when recoverable
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: HYPE-H1-LOCAL-V5-RECOVERED
          path: recovered/prior
      - name: Preserve actual upstream job outcomes
        env:
          JOB_OUTCOMES: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path('study')
          out.mkdir(exist_ok=True)
          (out / 'ci_job_outcomes.json').write_text(json.dumps(json.loads(os.environ['JOB_OUTCOMES']), indent=2) + '\n')
          PY
      - name: Replay real forward observations without claiming a mature OOS sample
        id: forward
        if: ${{ needs.code_checks.result == 'success' }}
        continue-on-error: true
        run: python -m research.hype_local_v5.ci_run --forward-only --recovered recovered --output forward
      - name: Publish final results and exact blocked/skipped outcomes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.hype_local_v5.ci_publish --stage final --output ci-status --reports study forward
      - name: Preserve final reports as an Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-H1-LOCAL-V5-FINAL-REPORTS
          path: |
            study
            forward
            ci-status
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failed validation and collection outcomes
        if: ${{ needs.code_checks.result != 'success' || (needs.historical_micro5s.result != 'success' && needs.historical_micro5s.result != 'skipped') || needs.causal_replay.result != 'success' || (needs.live_microstructure.result != 'success' && needs.live_microstructure.result != 'skipped') || steps.forward.outcome != 'success' }}
        run: exit 1
