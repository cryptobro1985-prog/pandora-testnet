name: HYPE Movement Signature Strength V3 Microgrid
on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - '.github/workflows/hype-movement-signature-v3-microgrid.yml'
      - 'research/hype_movement_signature/replay_strength_v3_microgrid.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 0
      - run: python -m pip install numpy pandas scikit-learn
      - uses: actions/download-artifact@v4
        with:
          name: HYPE-HISTORY-20260712-20261103-MASTER
          path: /tmp/hype_master/unpacked
          run-id: 42564417286
          github-token: ${{ github.token }}
      - run: |
          rm -rf research/hype_movement_signature/results_v3_microgrid
          python research/hype_movement_signature/replay_strength_v3_microgrid.py --master-root /tmp/hype_master/unpacked --out research/hype_movement_signature/results_v3_microgrid
      - run: |
          git pull --rebase origin research/hype-h1-local-v5-oi-microstructure-20261104
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/hype_movement_signature/results_v3_microgrid
          if ! git diff --cached --quiet; then
            git commit -m "Add movement-strength V3 microgrid results"
            git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104
          fi
