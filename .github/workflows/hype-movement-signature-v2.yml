name: HYPE Movement Signature Normalized V2

on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - '.github/workflows/hype-movement-signature-v2.yml'
      - 'research/hype_movement_signature/replay_normalized_v2.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  replay_v2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn
      - name: Download master
        uses: actions/download-artifact@v4
        with:
          name: HYPE-HISTORY-20260712-20261103-MASTER
          path: /tmp/hype_master/unpacked
          run-id: 42564417286
          github-token: ${{ github.token }}
      - name: Run normalized V2
        run: |
          set -euo pipefail
          rm -rf research/hype_movement_signature/results_v2
          python research/hype_movement_signature/replay_normalized_v2.py \
            --master-root /tmp/hype_master/unpacked \
            --out research/hype_movement_signature/results_v2
      - name: Commit V2 results
        run: |
          set -euo pipefail
          git pull --rebase origin research/hype-h1-local-v5-oi-microstructure-20261104
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/hype_movement_signature/results_v2
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Add normalized movement-signature V2 results"
            git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104
          fi
