name: HYPE Fast 7-Missing-Layers Strong Days

on:
  workflow_dispatch:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - ".github/workflows/hype-rich-strong-days-sep-oct.yml"
      - "research/hype_full_micro_202607/collect_missing_rich_layers.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: hype-fast-7-missing-strong-days
  cancel-in-progress: true

jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - { id: SEP03, start: "2026-09-03T00:00:00+00:00", end: "2026-09-04T00:00:00+00:00" }
          - { id: SEP10, start: "2026-09-10T00:00:00+00:00", end: "2026-09-11T00:00:00+00:00" }
          - { id: SEP17, start: "2026-09-17T00:00:00+00:00", end: "2026-09-18T00:00:00+00:00" }
          - { id: SEP18, start: "2026-09-18T00:00:00+00:00", end: "2026-09-19T00:00:00+00:00" }
          - { id: SEP30, start: "2026-09-30T00:00:00+00:00", end: "2026-10-01T00:00:00+00:00" }
          - { id: OCT05, start: "2026-10-05T00:00:00+00:00", end: "2026-10-06T00:00:00+00:00" }
          - { id: OCT08, start: "2026-10-08T00:00:00+00:00", end: "2026-10-09T00:00:00+00:00" }
          - { id: OCT12, start: "2026-10-12T00:00:00+00:00", end: "2026-10-13T00:00:00+00:00" }
          - { id: OCT22, start: "2026-10-22T00:00:00+00:00", end: "2026-10-23T00:00:00+00:00" }
          - { id: OCT26, start: "2026-10-26T00:00:00+00:00", end: "2026-10-27T00:00:00+00:00" }
          - { id: OCT27, start: "2026-10-27T00:00:00+00:00", end: "2026-10-28T00:00:00+00:00" }
          - { id: OCT29, start: "2026-10-29T00:00:00+00:00", end: "2026-10-30T00:00:00+00:00" }
          - { id: OCT30, start: "2026-10-30T00:00:00+00:00", end: "2026-10-31T00:00:00+00:00" }

    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONUNBUFFERED: "1"
      CRYPTOHFTDATA_API_KEY: ${{ secrets.CRYPTOHFTDATA_API_KEY }}
      HYPE_FULL_MICRO_START_UTC: ${{ matrix.start }}
      HYPE_FULL_MICRO_END_UTC: ${{ matrix.end }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal stack
        run: python -m pip install --disable-pip-version-check polars pyarrow requests zstandard

      - name: Syntax check
        run: python -m py_compile research/hype_full_micro_202607/collect_missing_rich_layers.py

      - name: Collect ONLY 7 missing layers
        run: |
          set -euo pipefail
          OUT="rich7_${{ matrix.id }}"
          CACHE="/tmp/rich7_cache_${{ matrix.id }}"
          mkdir -p "$OUT" "$CACHE"
          python -m research.hype_full_micro_202607.collect_missing_rich_layers \
            --output "$OUT" --cache "$CACHE" | tee "/tmp/build_${{ matrix.id }}.log"
          test -s "$OUT/missing_rich_layers_1m.jsonl.gz"
          test -s "$OUT/manifest.json"
          test -s "$OUT/COLLECTION_AUDIT.json"
          rm -rf "$CACHE"
          gzip -9 -f "/tmp/build_${{ matrix.id }}.log"

      - name: Verify exact scope
        run: |
          python - <<'PY'
          import json, os, pathlib
          out=pathlib.Path("rich7_"+os.environ["MATRIX_ID"])
          m=json.load(open(out/"manifest.json"))
          a=json.load(open(out/"COLLECTION_AUDIT.json"))
          assert m["explicitly_not_downloaded"] == ["trades"]
          assert m["reuses_existing_history"] is True
          assert int(a["rows_1m"]) > 0
          print(json.dumps({"day":os.environ["MATRIX_ID"],"rows":a["rows_1m"],"missing":a["missing_file_count"],"compact_mb":a["compact_output_mb"]}))
          PY
        env:
          MATRIX_ID: ${{ matrix.id }}

      - name: Upload compact overlay
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-7LAYER-${{ matrix.id }}-${{ github.run_id }}
          path: |
            rich7_${{ matrix.id }}/**
            /tmp/build_${{ matrix.id }}.log.gz
          retention-days: 14
          compression-level: 0

  summary:
    if: always()
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - run: echo "Fast 7-layer collection matrix finished with result=${{ needs.collect.result }}"
