name: HYPE Rich Strong-Days Collector Sep-Oct 2026

on:
  workflow_dispatch:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - ".github/workflows/hype-rich-strong-days-sep-oct.yml"
      - "research/hype_full_micro_202607/build_dense_full_micro.py"
      - "research/hype_full_micro_202607/collect_missing_rich_layers.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: hype-rich-strong-days-sep-oct-v1
  cancel-in-progress: true

jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - id: SEP03
            start: "2026-09-02T12:00:00+00:00"
            end:   "2026-09-04T12:00:00+00:00"
          - id: SEP10
            start: "2026-09-09T12:00:00+00:00"
            end:   "2026-09-11T12:00:00+00:00"
          - id: SEP17_18
            start: "2026-09-16T12:00:00+00:00"
            end:   "2026-09-19T12:00:00+00:00"
          - id: SEP30
            start: "2026-09-29T12:00:00+00:00"
            end:   "2026-10-01T12:00:00+00:00"
          - id: OCT05
            start: "2026-10-04T12:00:00+00:00"
            end:   "2026-10-06T12:00:00+00:00"
          - id: OCT08
            start: "2026-10-07T12:00:00+00:00"
            end:   "2026-10-09T12:00:00+00:00"
          - id: OCT12
            start: "2026-10-11T12:00:00+00:00"
            end:   "2026-10-13T12:00:00+00:00"
          - id: OCT22
            start: "2026-10-21T12:00:00+00:00"
            end:   "2026-10-23T12:00:00+00:00"
          - id: OCT26_30
            start: "2026-10-25T12:00:00+00:00"
            end:   "2026-10-31T12:00:00+00:00"

    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      CRYPTOHFTDATA_API_KEY: ${{ secrets.CRYPTOHFTDATA_API_KEY }}
      HYPE_FULL_MICRO_START_UTC: ${{ matrix.start }}
      HYPE_FULL_MICRO_END_UTC: ${{ matrix.end }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy polars pyarrow requests scikit-learn zstandard

      - name: Smoke-test missing-rich collector
        run: |
          python -m py_compile research/hype_full_micro_202607/collect_missing_rich_layers.py

      - name: Build missing rich layers only
        run: |
          set -euo pipefail
          OUT="rich_out_${{ matrix.id }}"
          CACHE="rich_cache_${{ matrix.id }}"
          mkdir -p "$OUT" "$CACHE"
          python -m research.hype_full_micro_202607.collect_missing_rich_layers \
  --output "$OUT" --cache "$CACHE" | tee "build_${{ matrix.id }}.log"
          test -s "$OUT/missing_rich_layers_1m.jsonl.gz"
test -s "$OUT/manifest.json"
test -s "$OUT/COLLECTION_AUDIT.json"

      - name: Verify completeness and quality
        shell: bash
        run: |
          set -euo pipefail
          OUT="rich_out_${{ matrix.id }}"
          python - <<'PY'
          import json,os,pathlib,gzip
          out=pathlib.Path("rich_out_"+os.environ["MATRIX_ID"])
          m=json.load(open(out/"manifest.json"))
          a=json.load(open(out/"COLLECTION_AUDIT.json"))
          assert m.get("explicitly_not_downloaded")==["trades"]
          assert m.get("reuses_existing_history") is True
          assert int(a.get("rows_1m") or 0)>0
          print("MISSING_RICH_AUDIT="+json.dumps(a,separators=(",",":")))
          PY
        env:
          MATRIX_ID: ${{ matrix.id }}

      - name: Compact output and remove raw cache
        shell: bash
        run: |
          set -euo pipefail
          OUT="rich_out_${{ matrix.id }}"
          CACHE="rich_cache_${{ matrix.id }}"
          RAW_BYTES=$(python - <<'PY'
          import json,os,pathlib
          m=json.load(open(pathlib.Path("rich_out_"+os.environ["MATRIX_ID"])/"manifest.json"))
          print(int(m.get("downloaded_bytes_ephemeral") or m.get("downloaded_bytes") or 0))
          PY
          )
          OUT_BYTES=$(du -sb "$OUT" | awk '{print $1}')
          export RAW_BYTES OUT_BYTES
          gzip -9 -f "build_${{ matrix.id }}.log"
          rm -rf "$CACHE"
          python - <<'PY'
          import json,os,pathlib
          out=pathlib.Path("rich_out_"+os.environ["MATRIX_ID"])
          p=out/"COLLECTION_AUDIT.json"
          d=json.load(open(p))
          raw=int(os.environ.get("RAW_BYTES","0"))
          compact=int(os.environ.get("OUT_BYTES","0"))
          d["raw_download_bytes_ephemeral"]=raw
          d["compact_output_bytes"]=compact
          d["compression_ratio_raw_to_compact"]=(raw/compact if compact else None)
          d["raw_cache_retained"]=False
          json.dump(d,open(p,"w"),indent=2)
          print(json.dumps({
            "raw_download_mb":round(raw/1024/1024,2),
            "compact_output_mb":round(compact/1024/1024,2),
            "compression_ratio":round(raw/compact,2) if compact else None,
            "raw_cache_retained":False
          }))
          PY
        env:
          MATRIX_ID: ${{ matrix.id }}

      - name: Upload rich dataset
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-RICH-STRONG-${{ matrix.id }}-${{ github.run_id }}
          path: |
            rich_out_${{ matrix.id }}/**
            build_${{ matrix.id }}.log.gz
          retention-days: 14
          compression-level: 0

  summary:
    if: always()
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - name: Final collector status
        run: |
          echo "All matrix windows reached terminal state."
          echo "Result: ${{ needs.collect.result }}"
