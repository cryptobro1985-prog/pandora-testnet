name: HYPE Rich Strong-Days Collector Sep-Oct 2026

on:
  workflow_dispatch:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - ".github/workflows/hype-rich-strong-days-sep-oct.yml"
      - "research/hype_full_micro_202607/build_dense_full_micro.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: hype-rich-strong-days-sep-oct-v1
  cancel-in-progress: true

jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - id: SEP03
            start: "2026-09-02T12:00:00+00:00"
            end:   "2026-09-04T12:00:00+00:00"
          - id: SEP10
            start: "2026-09-09T12:00:00+00:00"
            end:   "2026-09-11T12:00:00+00:00"
          - id: SEP17_18
            start: "2026-09-16T12:00:00+00:00"
            end:   "2026-09-19T12:00:00+00:00"
          - id: SEP30
            start: "2026-09-29T12:00:00+00:00"
            end:   "2026-10-01T12:00:00+00:00"
          - id: OCT05
            start: "2026-10-04T12:00:00+00:00"
            end:   "2026-10-06T12:00:00+00:00"
          - id: OCT08
            start: "2026-10-07T12:00:00+00:00"
            end:   "2026-10-09T12:00:00+00:00"
          - id: OCT12
            start: "2026-10-11T12:00:00+00:00"
            end:   "2026-10-13T12:00:00+00:00"
          - id: OCT22
            start: "2026-10-21T12:00:00+00:00"
            end:   "2026-10-23T12:00:00+00:00"
          - id: OCT26_30
            start: "2026-10-25T12:00:00+00:00"
            end:   "2026-10-31T12:00:00+00:00"

    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      CRYPTOHFTDATA_API_KEY: ${{ secrets.CRYPTOHFTDATA_API_KEY }}
      HYPE_FULL_MICRO_START_UTC: ${{ matrix.start }}
      HYPE_FULL_MICRO_END_UTC: ${{ matrix.end }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy polars pyarrow requests scikit-learn zstandard

      - name: Smoke-test positioning lifecycle
        run: |
          python -m py_compile research/hype_full_micro_202607/build_dense_full_micro.py
          python - <<'PY'
          from research.hype_full_micro_202607.build_dense_full_micro import attach_positioning_lifecycle
          rows=[{
            "candidate_id":"SMOKE","side":"LOW","snapshot_ts_ms":1,
            "features":{
              "fullmicro_open_interest_sum_open_interest":100.0,
              "fullmicro_open_interest_sum_open_interest_value":1000.0,
              "fullmicro_account_long_short_ratio":1.0,
              "sell_eff_60s":2.0,
              "fullmicro_long_liq_notional_60s":10.0,
              "retrace_bps":0.0,"rev_flow_60s":0.0
            }
          },{
            "candidate_id":"SMOKE","side":"LOW","snapshot_ts_ms":2,
            "features":{
              "fullmicro_open_interest_sum_open_interest":98.0,
              "fullmicro_open_interest_sum_open_interest_value":990.0,
              "fullmicro_account_long_short_ratio":0.95,
              "sell_eff_60s":1.0,
              "fullmicro_long_liq_notional_60s":2.0,
              "retrace_bps":25.0,"rev_flow_60s":0.5
            }
          }]
          out=attach_positioning_lifecycle(rows)
          f=out[-1]["features"]
          assert "positioning_oi_delta_from_candidate" in f
          assert "positioning_old_side_closing_proxy" in f
          assert "positioning_control_transfer_proxy" in f
          print("POSITIONING_SMOKE_OK")
          PY

      - name: Build rich causal dataset
        run: |
          set -euo pipefail
          OUT="rich_out_${{ matrix.id }}"
          CACHE="rich_cache_${{ matrix.id }}"
          mkdir -p "$OUT" "$CACHE"
          python -m research.hype_full_micro_202607.build_dense_full_micro \
            --output "$OUT" --cache "$CACHE" | tee "build_${{ matrix.id }}.log"
          test -s "$OUT/candidate_snapshots_full_micro.jsonl.gz"
          test -s "$OUT/compact_1m.jsonl.gz"
          test -s "$OUT/labels.json.gz"
          test -s "$OUT/manifest.json"
          test -s "$OUT/feature_availability.json"

      - name: Verify completeness and quality
        shell: bash
        run: |
          set -euo pipefail
          OUT="rich_out_${{ matrix.id }}"
          python - <<'PY'
          import gzip,json,math,os,pathlib
          out=pathlib.Path("rich_out_"+os.environ["MATRIX_ID"])
          m=json.load(open(out/"manifest.json"))
          a=json.load(open(out/"feature_availability.json"))
          rows=0; book_valid=0; crossed=0
          liq_valid={5:0,15:0,60:0,180:0,300:0}
          with gzip.open(out/"candidate_snapshots_full_micro.jsonl.gz","rt",encoding="utf-8") as fh:
              for line in fh:
                  if not line.strip(): continue
                  r=json.loads(line); rows+=1
                  f=r.get("features") or {}
                  if float(f.get("fullmicro_book_valid",0) or 0)==1.0: book_valid+=1
                  if float(f.get("fullmicro_book_crossed",0) or 0)==1.0: crossed+=1
                  for sec in liq_valid:
                      if float(f.get(f"fullmicro_liq_stream_valid_{sec}s",0) or 0)==1.0:
                          liq_valid[sec]+=1
          counts=m.get("source_file_counts",{})
          summary={
            "id":os.environ["MATRIX_ID"],
            "period":m.get("period"),
            "downloaded_files":m.get("downloaded_files"),
            "downloaded_bytes":m.get("downloaded_bytes"),
            "source_file_counts":counts,
            "missing_file_count":len(m.get("missing_files") or []),
            "missing_files":m.get("missing_files") or [],
            "candidate_snapshots":rows,
            "book_valid_rows":book_valid,
            "book_crossed_rows_masked":crossed,
            "liq_valid_rows":liq_valid,
            "available_input_ids":a.get("historically_observed_or_derived_input_ids"),
            "missing_input_ids":a.get("missing_input_ids"),
            "quality_contract":m.get("microstructure_quality_contract"),
            "status":"COMPLETE_WITH_GAPS" if m.get("missing_files") else "COMPLETE_NO_REPORTED_GAPS"
          }
          json.dump(summary,open(out/"COLLECTION_AUDIT.json","w"),indent=2)
          print("COLLECTION_AUDIT="+json.dumps(summary,separators=(",",":")))
          assert rows>0
          PY
        env:
          MATRIX_ID: ${{ matrix.id }}

      - name: Compact output and remove raw cache
        shell: bash
        run: |
          set -euo pipefail
          OUT="rich_out_${{ matrix.id }}"
          CACHE="rich_cache_${{ matrix.id }}"
          RAW_BYTES=$(python - <<'PY'
          import json,os,pathlib
          m=json.load(open(pathlib.Path("rich_out_"+os.environ["MATRIX_ID"])/"manifest.json"))
          print(int(m.get("downloaded_bytes") or 0))
          PY
          )
          OUT_BYTES=$(du -sb "$OUT" | awk '{print $1}')
          export RAW_BYTES OUT_BYTES
          gzip -9 -f "build_${{ matrix.id }}.log"
          rm -rf "$CACHE"
          python - <<'PY'
          import json,os,pathlib
          out=pathlib.Path("rich_out_"+os.environ["MATRIX_ID"])
          p=out/"COLLECTION_AUDIT.json"
          d=json.load(open(p))
          raw=int(os.environ.get("RAW_BYTES","0"))
          compact=int(os.environ.get("OUT_BYTES","0"))
          d["raw_download_bytes_ephemeral"]=raw
          d["compact_output_bytes"]=compact
          d["compression_ratio_raw_to_compact"]=(raw/compact if compact else None)
          d["raw_cache_retained"]=False
          json.dump(d,open(p,"w"),indent=2)
          print(json.dumps({
            "raw_download_mb":round(raw/1024/1024,2),
            "compact_output_mb":round(compact/1024/1024,2),
            "compression_ratio":round(raw/compact,2) if compact else None,
            "raw_cache_retained":False
          }))
          PY
        env:
          MATRIX_ID: ${{ matrix.id }}

      - name: Upload rich dataset
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-RICH-STRONG-${{ matrix.id }}-${{ github.run_id }}
          path: |
            rich_out_${{ matrix.id }}/**
            build_${{ matrix.id }}.log.gz
          retention-days: 14
          compression-level: 0

  summary:
    if: always()
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - name: Final collector status
        run: |
          echo "All matrix windows reached terminal state."
          echo "Result: ${{ needs.collect.result }}"
