      - name: Compact learner logs and raw market evidence
        shell: bash
        run: |
          set -euo pipefail
          if test -s local_cp/LOCAL_EVENTS.jsonl; then
            tail -n 5000 local_cp/LOCAL_EVENTS.jsonl > local_cp/LOCAL_EVENTS.recent.jsonl
            gzip -9 -f local_cp/LOCAL_EVENTS.recent.jsonl
          fi
          if test -s local_cp/LOCAL_LIVE_LABELS.jsonl; then
            tail -n 20000 local_cp/LOCAL_LIVE_LABELS.jsonl > local_cp/LOCAL_LIVE_LABELS.recent.jsonl
            gzip -9 -f local_cp/LOCAL_LIVE_LABELS.recent.jsonl
          fi
          find live_capture -type f -name '*.jsonl' -size +0c -print0 | xargs -0 -r -n1 gzip -9
          find live_capture -type f -name '*.log' -size +0c -print0 | xargs -0 -r -n1 gzip -9
          du -sh local_cp live_capture || true

