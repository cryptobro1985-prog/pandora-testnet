name: HYPE LOCAL-ONLY — 30D Pretrain + Live

on:
  workflow_dispatch:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - "research/hype_local_only/**"
      - ".github/workflows/hype-local-only.yml"
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: hype-local-only
  cancel-in-progress: false

env:
  HYPE_REST_RELAY_URL: ""
  CORTEX_LOCAL_URL: "http://127.0.0.1:8081"
  CORTEX_PORT: "8081"
  CORTEX_CTX_SIZE: "4096"
  CORTEX_THREADS: "4"
  CORTEX_HF_MODEL: "ggml-org/gpt-oss-20b-GGUF:MXFP4"
  ASTRA_CORTEX_MODEL: "gpt-oss-20b-local"
  # Render workspace is billing-suspended; direct POST would block the live
  # daemon. Status continues through GitHub Issue #24 for the static fallback.
  LOCAL_ONLY_MONITOR_URL: ""

jobs:
  local-only:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r research/hype_local_v5/requirements-research.txt
          python -m pip install -r research/hype_quant/requirements.txt
          python -m py_compile \
            research/hype_local_only/model.py \
            research/hype_local_only/live_features.py \
            research/hype_local_only/feature_discovery.py \
            research/hype_local_only/train_history.py \
            research/hype_local_only/live_daemon.py \
            research/hype_local_only/live_relationship_miner.py \
            research/hype_local_only/cortex_daemon.py \
            research/hype_local_only/forward_first_signal_audit.py \
            research/hype_local_only/strategy_scoreboard.py \
            research/hype_false_local_entry/hard120_persistence_shadow.py \
            research/hype_false_local_entry/time_to_confirmation_engine.py \
            research/hype_false_local_entry/time_to_confirmation_live.py \
            research/hype_false_local_entry/local_signature_model.py \
            research/hype_false_local_entry/local_signature_live.py
          python -m unittest \
            research.hype_false_local_entry.test_time_to_confirmation_engine \
            research.hype_false_local_entry.test_time_to_confirmation_live \
            research.hype_false_local_entry.test_local_signature_model \
            research.hype_local_only.test_forward_first_signal_scope

      - name: Cancel deprecated Caterpillar / Direct-Policy live runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for WF in hype-v12-immediate-full-graph.yml only-profit-continuous.yml; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WF}/runs?per_page=30" \
              --jq '.workflow_runs[] | select(.status=="in_progress" or .status=="queued" or .status=="pending") | .id' |
            while read -r ID; do
              [ -z "${ID}" ] && continue
              echo "cancel deprecated run ${ID} (${WF})"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${ID}/cancel" >/dev/null || true
            done
          done

      - name: Restore Local-only checkpoint if present
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf local_cp
          mkdir -p local_cp
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=HYPE-LOCAL-ONLY-CHECKPOINT" \
            --jq '.artifacts | map(select((.expired|not) and .name=="HYPE-LOCAL-ONLY-CHECKPOINT")) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "${ID}" ]; then
            echo "restoring Local-only checkpoint ${ID}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > local.zip
            unzip -q local.zip -d local_cp
          fi
          # If the historical gap backfill has passed its independent OOS gate,
          # promote it once into the Local-only checkpoint. Preserve the live H1
          # baseline/runtime; do not repeatedly overwrite online learning.
          EID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=HYPE-LOCAL-ONLY-ENRICHED-PRETRAIN"             --jq '.artifacts | map(select((.expired|not) and .name=="HYPE-LOCAL-ONLY-ENRICHED-PRETRAIN")) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "${EID:-}" ]; then
            rm -rf enriched_pretrain enriched.zip
            mkdir -p enriched_pretrain
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$EID/zip" > enriched.zip
            unzip -q enriched.zip -d enriched_pretrain
            python - <<'PY'
          import json,pickle,shutil
          from pathlib import Path
          root=Path("enriched_pretrain")
          promo=next(iter(root.rglob("PROMOTION.json")),None)
          modelp=next(iter(root.rglob("local_only_model.pkl")),None)
          memp=next(iter(root.rglob("LOCAL_RELATIONSHIP_MEMORY.json")),None)
          reportp=next(iter(root.rglob("HISTORICAL_TRAINING_REPORT.json")),None)
          if not all((promo,modelp,memp)):
              print("enriched_pretrain incomplete; skip")
              raise SystemExit(0)
          v=json.loads(promo.read_text())
          if not v.get("promoted"):
              print("enriched OOS gate did not pass; keeping current model")
              raise SystemExit(0)
          dst=Path("local_cp/local_only_model.pkl")
          old=None
          if dst.exists():
              try:
                  old=pickle.load(dst.open("rb"))
                  if (getattr(old,"history_meta",{}) or {}).get("historical_gap_backfill"):
                      print("enriched history already promoted")
                      raise SystemExit(0)
                  if int(getattr(old,"live_labels",0) or 0)>50:
                      print("current checkpoint has >50 live labels; skip automatic history replacement")
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception:
                  old=None
          new=pickle.load(modelp.open("rb"))
          if old is not None:
              # Keep the live H1 teacher learner and operational context.
              for attr in ("h1_models","h1_labels","h1_positive","h1_thresholds",
                           "h1_last_trained_hour_ms","h1_shadow","last_signal",
                           "internal_models","internal_labels","internal_positive",
                           "internal_thresholds","internal_live_labels"):
                  if hasattr(old,attr):setattr(new,attr,getattr(old,attr))
              new.history_meta["live_labels_before_history_upgrade"]=int(getattr(old,"live_labels",0) or 0)
          new.save(dst)
          shutil.copy2(memp,"local_cp/LOCAL_RELATIONSHIP_MEMORY.json")
          if reportp:shutil.copy2(reportp,"local_cp/HISTORICAL_TRAINING_REPORT.json")
          shutil.copy2(promo,"local_cp/HISTORICAL_GAP_PROMOTION.json")
          print("promoted OOS-approved historical gap model")
          PY
          fi

          if test -s local_cp/LOCAL_LIVE_LABELS.recent.jsonl.gz && ! test -s local_cp/LOCAL_LIVE_LABELS.jsonl; then
            gzip -cd local_cp/LOCAL_LIVE_LABELS.recent.jsonl.gz > local_cp/LOCAL_LIVE_LABELS.jsonl
          fi
          if test -s local_cp/LOCAL_EVENTS.recent.jsonl.gz && ! test -s local_cp/LOCAL_EVENTS.jsonl; then
            gzip -cd local_cp/LOCAL_EVENTS.recent.jsonl.gz > local_cp/LOCAL_EVENTS.jsonl
          fi

          if test -s local_cp/local_only_model.pkl && test -s local_cp/LOCAL_RELATIONSHIP_MEMORY.json; then
            echo "found=1" >> "${GITHUB_OUTPUT}"
          else
            echo "found=0" >> "${GITHUB_OUTPUT}"
          fi

      - name: Detect legacy provisional-pivot checkpoint
        id: terminal_migration
        if: steps.restore.outputs.found == '1'
        shell: bash
        run: |
          python - <<'PY' >> "${GITHUB_OUTPUT}"
          from pathlib import Path
          from research.hype_local_only.model import LocalOnlyModel
          from research.hype_local_only.migrate_terminal_teacher import already_migrated
          p=Path("local_cp/local_only_model.pkl")
          q=LocalOnlyModel.load(p)
          print("needed="+("0" if already_migrated(q) else "1"))
          PY

      - name: Rebuild clean finalized STRICT/H1 baseline for terminal migration
        if: steps.restore.outputs.found == '1' && steps.terminal_migration.outputs.needed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf terminal_clean_history terminal_clean
          mkdir -p terminal_clean_history terminal_clean
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=local116-HYPE" \
            --jq '.artifacts | map(select((.expired|not) and .name=="local116-HYPE")) | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "${ID}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > terminal_clean_history.zip
          unzip -q terminal_clean_history.zip -d terminal_clean_history
          test -s terminal_clean_history/candidate_snapshots.jsonl.gz
          test -s terminal_clean_history/compact_1m.jsonl.gz
          test -s terminal_clean_history/labels.json.gz
          python -m research.hype_local_only.train_history \
            --snapshots terminal_clean_history/candidate_snapshots.jsonl.gz \
            --compact-1m terminal_clean_history/compact_1m.jsonl.gz \
            --labels-gz terminal_clean_history/labels.json.gz \
            --model-out terminal_clean/local_only_model.pkl \
            --memory-out terminal_clean/LOCAL_RELATIONSHIP_MEMORY.json \
            --report-out terminal_clean/HISTORICAL_TRAINING_REPORT.json
          python -m research.hype_local_only.migrate_terminal_teacher \
            --current-model local_cp/local_only_model.pkl \
            --clean-model terminal_clean/local_only_model.pkl \
            --runtime local_cp/local_runtime.pkl \
            --report local_cp/TERMINAL_TEACHER_MIGRATION.json
          cp terminal_clean/LOCAL_RELATIONSHIP_MEMORY.json local_cp/LOCAL_RELATIONSHIP_MEMORY.json
          cp terminal_clean/HISTORICAL_TRAINING_REPORT.json local_cp/HISTORICAL_TRAINING_REPORT.json
          rm -f local_cp/LIVE_DISCOVERY_RELATIONSHIPS.json
          test -s local_cp/TERMINAL_TEACHER_MIGRATION.json

      - name: Download 30-day labelled Local dataset
        if: steps.restore.outputs.found != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf history30 history30.zip
          mkdir -p history30
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=local116-HYPE" \
            --jq '.artifacts | map(select((.expired|not) and .name=="local116-HYPE")) | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "${ID}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > history30.zip
          unzip -q history30.zip -d history30
          test -s history30/candidate_snapshots.jsonl.gz
          test -s history30/manifest.json
          python - <<'PY'
          import json
          m=json.load(open("history30/manifest.json"))
          assert m["candidate_snapshots"]==6261
          assert m["future_leakage_guard"]
          print("history_period",m["period"])
          print("candidate_snapshots",m["candidate_snapshots"])
          PY

      - name: Pretrain Quantum HIGH/LOW heads and build Cortex memory
        if: steps.restore.outputs.found != '1'
        run: |
          python -m research.hype_local_only.train_history \
            --snapshots history30/candidate_snapshots.jsonl.gz \
            --compact-1m history30/compact_1m.jsonl.gz \
            --labels-gz history30/labels.json.gz \
            --model-out local_cp/local_only_model.pkl \
            --memory-out local_cp/LOCAL_RELATIONSHIP_MEMORY.json \
            --report-out local_cp/HISTORICAL_TRAINING_REPORT.json
          test -s local_cp/local_only_model.pkl
          test -s local_cp/LOCAL_RELATIONSHIP_MEMORY.json
          test -s local_cp/HISTORICAL_TRAINING_REPORT.json

      - name: Start Cortex 20B in parallel
        shell: bash
        run: |
          set +e
          bash research/hype_quant/start_local_cortex.sh > local_cp/cortex_boot.log 2>&1 &
          echo $! > local_cp/cortex_boot.pid
          set -e

      - name: Run Local-only live collection and inference
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf live_capture
          mkdir -p live_capture

          python -m research.hype_local_only.live_daemon \
            --capture-root live_capture \
            --checkpoint-dir local_cp \
            --minutes 50 > local_cp/local_daemon.log 2>&1 &
          LOCAL_PID=$!

          python -m research.hype_local_only.cortex_daemon \
            --checkpoint-dir local_cp \
            --minutes 50 \
            --interval-seconds 300 > local_cp/cortex_daemon.log 2>&1 &
          CORTEX_DAEMON_PID=$!

          set +e
          python research/hype_local_v5/resilient_capture.py \
            --minutes 50 --chunk-minutes 20 --output live_capture
          CAP_RC=$?
          set -e

          wait "${LOCAL_PID}"
          LOCAL_RC=$?
          wait "${CORTEX_DAEMON_PID}" || true

          if [ -f /tmp/cortex20b.pid ]; then
            kill "$(cat /tmp/cortex20b.pid)" 2>/dev/null || true
          fi
          if [ -f local_cp/cortex_boot.pid ]; then
            kill "$(cat local_cp/cortex_boot.pid)" 2>/dev/null || true
          fi

          echo "capture_rc=${CAP_RC} local_rc=${LOCAL_RC}"
          test "${CAP_RC}" -eq 0
          test "${LOCAL_RC}" -eq 0
          test -s local_cp/LOCAL_ONLY_STATUS.json
          test -s local_cp/local_only_model.pkl

      - name: Mine matured live discovery relationships
        run: |
          python -m research.hype_local_only.live_relationship_miner \
            --labels local_cp/LOCAL_LIVE_LABELS.jsonl \
            --output local_cp/LIVE_DISCOVERY_RELATIONSHIPS.json
          test -s local_cp/LIVE_DISCOVERY_RELATIONSHIPS.json

      - name: Score terminal INTERNAL first-signal objectives
        run: |
          python -m research.hype_local_only.forward_first_signal_audit \
            --labels local_cp/LOCAL_LIVE_LABELS.jsonl \
            --events local_cp/LOCAL_EVENTS.jsonl \
            --output local_cp/FIRST_SIGNAL_FORWARD_STATUS.json
          python -m research.hype_local_only.forward_first_signal_audit \
            --labels local_cp/LOCAL_LIVE_LABELS.jsonl \
            --events local_cp/LOCAL_EVENTS.jsonl \
            --event-name LOCAL_SIGNATURE_SIGNAL \
            --teacher-scope STRICT \
            --actionable \
            --output local_cp/LOCAL_SIGNATURE_FORWARD_STATUS.json
          python -m research.hype_local_only.forward_first_signal_audit \
            --labels local_cp/LOCAL_LIVE_LABELS.jsonl \
            --events local_cp/LOCAL_EVENTS.jsonl \
            --event-name INTERNAL_TACTICAL_SIGNAL \
            --stage 60 \
            --actionable \
            --output local_cp/TACTICAL_60S_FORWARD_STATUS.json
          python -m research.hype_local_only.forward_first_signal_audit \
            --labels local_cp/LOCAL_LIVE_LABELS.jsonl \
            --events local_cp/LOCAL_EVENTS.jsonl \
            --event-name INTERNAL_TACTICAL_SIGNAL \
            --stage 180 \
            --actionable \
            --output local_cp/TACTICAL_180S_FORWARD_STATUS.json
          python -m research.hype_local_only.forward_first_signal_audit \
            --labels local_cp/LOCAL_LIVE_LABELS.jsonl \
            --events local_cp/LOCAL_EVENTS.jsonl \
            --event-name INTERNAL_TACTICAL_SIGNAL \
            --stage 300 \
            --actionable \
            --output local_cp/TACTICAL_300S_FORWARD_STATUS.json
          python -m research.hype_local_only.forward_first_signal_audit \
            --labels local_cp/LOCAL_LIVE_LABELS.jsonl \
            --events local_cp/LOCAL_EVENTS.jsonl \
            --event-name INTERNAL_HARD120_SIGNAL \
            --actionable \
            --output local_cp/HARD120_FORWARD_STATUS.json
          python -m research.hype_local_only.forward_first_signal_audit \
            --labels local_cp/LOCAL_LIVE_LABELS.jsonl \
            --events local_cp/LOCAL_EVENTS.jsonl \
            --event-name INTERNAL_HARD120_HIGH_FLOW_SHADOW \
            --actionable \
            --output local_cp/HARD120_HIGH_FLOW_SHADOW_FORWARD_STATUS.json
          python -m research.hype_local_only.forward_first_signal_audit \
            --labels local_cp/LOCAL_LIVE_LABELS.jsonl \
            --events local_cp/LOCAL_EVENTS.jsonl \
            --event-name INTERNAL_HARD120_HIGH_FLOW_V2_SHADOW \
            --actionable \
            --output local_cp/HARD120_HIGH_FLOW_V2_FORWARD_STATUS.json
          python -m research.hype_local_only.forward_first_signal_audit \
            --labels local_cp/LOCAL_LIVE_LABELS.jsonl \
            --events local_cp/LOCAL_EVENTS.jsonl \
            --event-name INTERNAL_HARD120_SIGNAL \
            --event-name INTERNAL_HARD120_HIGH_FLOW_V2_SHADOW \
            --actionable \
            --output local_cp/HARD120_PLUS_HIGH_FLOW_V2_FORWARD_STATUS.json
          python -m research.hype_local_only.forward_first_signal_audit \
            --labels local_cp/LOCAL_LIVE_LABELS.jsonl \
            --events local_cp/LOCAL_EVENTS.jsonl \
            --event-name INTERNAL_HARD120_HIGH_FLOW_V3_SHADOW \
            --actionable \
            --output local_cp/HARD120_HIGH_FLOW_V3_FORWARD_STATUS.json
          python -m research.hype_local_only.forward_first_signal_audit \
            --labels local_cp/LOCAL_LIVE_LABELS.jsonl \
            --events local_cp/LOCAL_EVENTS.jsonl \
            --event-name INTERNAL_HARD120_SIGNAL \
            --event-name INTERNAL_HARD120_HIGH_FLOW_V3_SHADOW \
            --actionable \
            --output local_cp/HARD120_PLUS_HIGH_FLOW_V3_FORWARD_STATUS.json
          python -m research.hype_local_only.forward_first_signal_audit \
            --labels local_cp/LOCAL_LIVE_LABELS.jsonl \
            --events local_cp/LOCAL_EVENTS.jsonl \
            --event-name INTERNAL_HARD120_SIGNAL \
            --event-name INTERNAL_HARD120_HIGH_FLOW_SHADOW \
            --actionable \
            --output local_cp/HARD120_PLUS_HIGH_FLOW_FORWARD_STATUS.json
          python -m research.hype_local_only.forward_first_signal_audit \
            --labels local_cp/LOCAL_LIVE_LABELS.jsonl \
            --events local_cp/LOCAL_EVENTS.jsonl \
            --event-name INTERNAL_EARLY60_STRONG_REVERSAL_SHADOW \
            --actionable \
            --output local_cp/EARLY60_STRONG_REVERSAL_FORWARD_STATUS.json
          python -m research.hype_local_only.forward_first_signal_audit \
            --labels local_cp/LOCAL_LIVE_LABELS.jsonl \
            --events local_cp/LOCAL_EVENTS.jsonl \
            --event-name INTERNAL_EARLY60_STRONG_REVERSAL_SHADOW \
            --event-name INTERNAL_HARD120_SIGNAL \
            --event-name INTERNAL_HARD120_HIGH_FLOW_SHADOW \
            --actionable \
            --output local_cp/EARLY60_PLUS_HARD120_HIGH_FLOW_FORWARD_STATUS.json
          python -m research.hype_local_only.forward_first_signal_audit \
            --labels local_cp/LOCAL_LIVE_LABELS.jsonl \
            --events local_cp/LOCAL_EVENTS.jsonl \
            --event-name INTERNAL_HARD120_HIGH60_VETO_STACK_SIGNAL \
            --actionable \
            --output local_cp/HIGH60_VETO_FORWARD_STATUS.json
          python -m research.hype_local_only.forward_first_signal_audit \
            --labels local_cp/LOCAL_LIVE_LABELS.jsonl \
            --events local_cp/LOCAL_EVENTS.jsonl \
            --event-name INTERNAL_EARLY60_STRONG_REVERSAL_SHADOW \
            --event-name INTERNAL_HARD120_HIGH60_VETO_STACK_SIGNAL \
            --event-name INTERNAL_HARD120_HIGH_FLOW_SHADOW \
            --actionable \
            --output local_cp/EARLY60_PLUS_HIGH60_VETO_HIGH_FLOW_FORWARD_STATUS.json
          python -m research.hype_local_only.forward_first_signal_audit \
            --labels local_cp/LOCAL_LIVE_LABELS.jsonl \
            --events local_cp/LOCAL_EVENTS.jsonl \
            --event-name INTERNAL_HARD120_PERSISTENCE_SHADOW \
            --actionable \
            --output local_cp/HARD120_PERSISTENCE_FORWARD_STATUS.json
          python -m research.hype_local_only.forward_first_signal_audit \
            --labels local_cp/LOCAL_LIVE_LABELS.jsonl \
            --events local_cp/LOCAL_EVENTS.jsonl \
            --event-name INTERNAL_EARLY60_STRONG_REVERSAL_SHADOW \
            --event-name INTERNAL_HARD120_PERSISTENCE_SHADOW \
            --event-name INTERNAL_HARD120_HIGH_FLOW_SHADOW \
            --actionable \
            --output local_cp/EARLY60_PLUS_PERSISTENCE_HARD120_HIGH_FLOW_FORWARD_STATUS.json
          test -s local_cp/FIRST_SIGNAL_FORWARD_STATUS.json
          test -s local_cp/LOCAL_SIGNATURE_FORWARD_STATUS.json
          test -s local_cp/TACTICAL_60S_FORWARD_STATUS.json
          test -s local_cp/TACTICAL_180S_FORWARD_STATUS.json
          test -s local_cp/TACTICAL_300S_FORWARD_STATUS.json
          test -s local_cp/HARD120_FORWARD_STATUS.json
          test -s local_cp/HARD120_HIGH_FLOW_SHADOW_FORWARD_STATUS.json
          test -s local_cp/HARD120_PLUS_HIGH_FLOW_FORWARD_STATUS.json
          test -s local_cp/HARD120_HIGH_FLOW_V2_FORWARD_STATUS.json
          test -s local_cp/HARD120_PLUS_HIGH_FLOW_V2_FORWARD_STATUS.json
          test -s local_cp/HARD120_HIGH_FLOW_V3_FORWARD_STATUS.json
          test -s local_cp/HARD120_PLUS_HIGH_FLOW_V3_FORWARD_STATUS.json
          test -s local_cp/EARLY60_STRONG_REVERSAL_FORWARD_STATUS.json
          test -s local_cp/EARLY60_PLUS_HARD120_HIGH_FLOW_FORWARD_STATUS.json
          test -s local_cp/HIGH60_VETO_FORWARD_STATUS.json
          test -s local_cp/EARLY60_PLUS_HIGH60_VETO_HIGH_FLOW_FORWARD_STATUS.json
          test -s local_cp/HARD120_PERSISTENCE_FORWARD_STATUS.json
          test -s local_cp/EARLY60_PLUS_PERSISTENCE_HARD120_HIGH_FLOW_FORWARD_STATUS.json

      - name: Rank frozen Local strategies from forward evidence
        run: |
          python -m research.hype_local_only.strategy_scoreboard \
            --checkpoint-dir local_cp \
            --output local_cp/STRATEGY_SCOREBOARD.json
          test -s local_cp/STRATEGY_SCOREBOARD.json

      - name: Write continuous-learning manifest
        run: |
          python - <<'PY'
          import json,os,time
          from pathlib import Path
          from research.hype_local_only.model import LocalOnlyModel
          cp=Path("local_cp")
          q=LocalOnlyModel.load(cp/"local_only_model.pkl")
          s=json.loads((cp/"LOCAL_ONLY_STATUS.json").read_text())
          live_labels_path=cp/"LOCAL_LIVE_LABELS.jsonl"
          live_rows=sum(1 for line in live_labels_path.open(encoding="utf-8") if line.strip()) if live_labels_path.exists() else 0
          cap_files=list(Path("live_capture").rglob("*.jsonl"))
          cap_bytes=sum(p.stat().st_size for p in cap_files if p.exists())
          out={
            "status":"CONTINUOUS_LEARNING",
            "run_id":os.getenv("GITHUB_RUN_ID"),
            "sha":os.getenv("GITHUB_SHA"),
            "generated_ts_ms":int(time.time()*1000),
            "research_only":True,
            "real_orders":False,
            "teacher":"DUAL_INTERNAL_L3_K1__STRICT_L6_K2",
            "task":"market state -> INTERNAL tactical local + STRICT core local",
