      - name: Prune old Local research artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ["GITHUB_REPOSITORY"]
          keep={"HYPE-LOCAL-ONLY-CHECKPOINT":3}
          prefixes={"HYPE-LOCAL-RAW-":12,"HYPE-LOCAL-ONLY-EVIDENCE-":12}
          raw=subprocess.check_output(["gh","api",f"repos/{repo}/actions/artifacts?per_page=100"],text=True)
          arts=json.loads(raw).get("artifacts",[])
          groups={}
          for a in arts:
              name=a.get("name","")
              key=name if name in keep else next((p for p in prefixes if name.startswith(p)),None)
              if key: groups.setdefault(key,[]).append(a)
          for key,items in groups.items():
              limit=keep.get(key,prefixes.get(key,0))
              items=sorted(items,key=lambda x:x.get("created_at",""),reverse=True)
              for a in items[limit:]:
                  subprocess.run(["gh","api","--method","DELETE",f"repos/{repo}/actions/artifacts/{a['id']}"],check=False)
                  print("deleted",key,a["id"])
          PY

      - name: Continue Local-only learning loop
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run hype-local-only.yml             --repo "${GITHUB_REPOSITORY}"             --ref "research/hype-h1-local-v5-oi-microstructure-20261104"
