name: Solana Wallet Leaders Research
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: solana-wallet-leaders-research
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/solana-wallet-leaders-20261106
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public Solana wallet observations
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          MAX_TOKENS: '12'
          SIGNATURES_PER_TOKEN: '25'
        run: python research/solana_wallet_leaders/collector.py
      - name: Persist observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/solana_wallet_leaders/state.json research/solana_wallet_leaders/latest_report.json
          if ! git diff --cached --quiet; then
            git commit -m "research: update Solana wallet leader observations"
            git push origin HEAD:research/solana-wallet-leaders-20261106
          fi
