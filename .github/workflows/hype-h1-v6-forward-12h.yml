name: HYPE v6 12h Research Material
# resilient-capture-watchdog-v2
# research-only chained capture; safe to rerun

on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - ".github/workflows/hype-h1-v6-forward-12h.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hype-v6-forward-12h-${{ github.run_id }}
  cancel-in-progress: false

env:
  CAPTURE_MINUTES: "170"

jobs:
  segment_1:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r research/hype_local_v5/requirements-research.txt
      - name: Capture segment 1 microstructure and structure
        shell: bash
        run: |
          set +e
          OUT="out/hype_v6_12h_segment_1"
          mkdir -p "$OUT"
          python research/hype_local_v5/resilient_capture.py --minutes "$CAPTURE_MINUTES" --chunk-minutes 20 --output "$OUT"
          python research/hype_local_v5/aggregate_forward.py --root "$OUT" --output "$OUT/AGGREGATE_SEGMENT.json" || true
      - name: Upload segment 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-H1-V6-12H-segment-1
          path: out/hype_v6_12h_segment_1
          if-no-files-found: error
          retention-days: 7

  segment_2:
    needs: segment_1
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r research/hype_local_v5/requirements-research.txt
      - name: Capture segment 2 microstructure and structure
        shell: bash
        run: |
          set +e
          OUT="out/hype_v6_12h_segment_2"
          mkdir -p "$OUT"
          python research/hype_local_v5/resilient_capture.py --minutes "$CAPTURE_MINUTES" --chunk-minutes 20 --output "$OUT"
          python research/hype_local_v5/aggregate_forward.py --root "$OUT" --output "$OUT/AGGREGATE_SEGMENT.json" || true
      - name: Upload segment 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-H1-V6-12H-segment-2
          path: out/hype_v6_12h_segment_2
          if-no-files-found: error
          retention-days: 7

  segment_3:
    needs: segment_2
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r research/hype_local_v5/requirements-research.txt
      - name: Capture segment 3 microstructure and structure
        shell: bash
        run: |
          set +e
          OUT="out/hype_v6_12h_segment_3"
          mkdir -p "$OUT"
          python research/hype_local_v5/resilient_capture.py --minutes "$CAPTURE_MINUTES" --chunk-minutes 20 --output "$OUT"
          python research/hype_local_v5/aggregate_forward.py --root "$OUT" --output "$OUT/AGGREGATE_SEGMENT.json" || true
      - name: Upload segment 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-H1-V6-12H-segment-3
          path: out/hype_v6_12h_segment_3
          if-no-files-found: error
          retention-days: 7

  segment_4:
    needs: segment_3
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r research/hype_local_v5/requirements-research.txt
      - name: Capture segment 4 microstructure and structure
        shell: bash
        run: |
          set +e
          OUT="out/hype_v6_12h_segment_4"
          mkdir -p "$OUT"
          python research/hype_local_v5/resilient_capture.py --minutes "$CAPTURE_MINUTES" --chunk-minutes 20 --output "$OUT"
          python research/hype_local_v5/aggregate_forward.py --root "$OUT" --output "$OUT/AGGREGATE_SEGMENT.json" || true
      - name: Upload segment 4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-H1-V6-12H-segment-4
          path: out/hype_v6_12h_segment_4
          if-no-files-found: error
          retention-days: 7

  combine:
    needs: segment_4
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all completed segments
        uses: actions/download-artifact@v4
        with:
          pattern: HYPE-H1-V6-12H-segment-*
          path: combined
      - name: Build combined research manifest
        run: |
          python research/hype_local_v5/aggregate_forward.py --root combined --output combined/HYPE_12H_RESEARCH_MANIFEST.json
      - name: Upload combined material
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-H1-V6-12H-COMBINED
          path: combined
          if-no-files-found: error
          retention-days: 7
