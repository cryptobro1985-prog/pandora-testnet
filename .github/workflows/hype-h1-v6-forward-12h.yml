name: HYPE v6 12h Research Material
# compact-110-v4-fixed-pack
# 2026-11-06-local-low-restart
# caterpillar-quant-v5-m1-provisional

on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - ".github/workflows/hype-h1-v6-forward-12h.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: hype-v6-forward-12h-caterpillar-v5-${{ github.ref }}
  cancel-in-progress: true

env:
  CAPTURE_MINUTES: "170"
  HYPE_REST_RELAY_URL: "https://hype-rest-relay.onrender.com"
  CATERPILLAR_QUANT_ENABLED: "1"
  CATERPILLAR_MONITOR_URL: "https://hype-caterpillar-quant-monitor.onrender.com/api/ingest"

jobs:
  segment_1:
    runs-on: ubuntu-latest
    timeout-minutes: 195
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: |
          python -m pip install -r research/hype_local_v5/requirements-research.txt
          python -m pip install -r research/hype_quant/requirements.txt
      - name: Validate compact research format and Caterpillar Quant
        run: |
          python -m py_compile research/hype_local_v5/compact_pack.py research/hype_local_v5/decode_compact.py research/hype_local_v5/context_capture.py research/hype_local_v5/resilient_capture.py
          python -m py_compile research/hype_caterpillar_quant/learner.py research/hype_caterpillar_quant/live_daemon.py
          bash -n research/hype_local_v5/capture_pack_segment.sh
          python research/hype_local_v5/test_compact_smoke.py
          python -m research.hype_quant.test_self
          python -m research.hype_caterpillar_quant.test_self
      - name: Restore latest Caterpillar Quant checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cq_warm
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '
            .artifacts
            | map(select((.expired|not) and (.name=="HYPE-CATERPILLAR-QUANT-CHECKPOINT" or (.name|startswith("HYPE-CATERPILLAR-QUANT-checkpoint-"))))) as $all
            | ($all | map(select(.name=="HYPE-CATERPILLAR-QUANT-CHECKPOINT")) | sort_by(.created_at) | reverse | .[0] // null) as $base
            | if $base then
                ($all | map(select(.created_at >= $base.created_at)) | sort_by(.created_at) | reverse | .[0].id // $base.id)
              else
                ($all | sort_by(.created_at) | reverse | .[0].id // empty)
              end
          ')"
          if [ -n "$ID" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$ID/zip" > cq.zip
            unzip -q cq.zip -d cq_warm
            echo "restored_caterpillar_checkpoint=$ID"
          else
            echo "no_prior_caterpillar_checkpoint"
          fi
      - name: Capture and compact segment 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATERPILLAR_STATUS_ISSUE: "24"
          CATERPILLAR_WARMSTART_DIR: cq_warm
        run: bash research/hype_local_v5/capture_pack_segment.sh out/hype_v6_12h_segment_1 "$CAPTURE_MINUTES"
      - name: Upload compact segment 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-H1-V6-12H-segment-1
          path: out/hype_v6_12h_segment_1_upload
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - name: Upload Caterpillar Quant checkpoint 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-CATERPILLAR-QUANT-checkpoint-1
          path: out/hype_v6_12h_segment_1_upload/caterpillar_quant
          if-no-files-found: warn
          retention-days: 2

  segment_2:
    needs: segment_1
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 195
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: |
          python -m pip install -r research/hype_local_v5/requirements-research.txt
          python -m pip install -r research/hype_quant/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: HYPE-CATERPILLAR-QUANT-checkpoint-1
          path: cq_warm
      - name: Capture and compact segment 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATERPILLAR_STATUS_ISSUE: "24"
          CATERPILLAR_WARMSTART_DIR: cq_warm
        run: bash research/hype_local_v5/capture_pack_segment.sh out/hype_v6_12h_segment_2 "$CAPTURE_MINUTES"
      - name: Upload compact segment 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-H1-V6-12H-segment-2
          path: out/hype_v6_12h_segment_2_upload
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - name: Upload Caterpillar Quant checkpoint 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-CATERPILLAR-QUANT-checkpoint-2
          path: out/hype_v6_12h_segment_2_upload/caterpillar_quant
          if-no-files-found: warn
          retention-days: 2

  segment_3:
    needs: segment_2
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 195
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: |
          python -m pip install -r research/hype_local_v5/requirements-research.txt
          python -m pip install -r research/hype_quant/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: HYPE-CATERPILLAR-QUANT-checkpoint-2
          path: cq_warm
      - name: Capture and compact segment 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATERPILLAR_STATUS_ISSUE: "24"
          CATERPILLAR_WARMSTART_DIR: cq_warm
        run: bash research/hype_local_v5/capture_pack_segment.sh out/hype_v6_12h_segment_3 "$CAPTURE_MINUTES"
      - name: Upload compact segment 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-H1-V6-12H-segment-3
          path: out/hype_v6_12h_segment_3_upload
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - name: Upload Caterpillar Quant checkpoint 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-CATERPILLAR-QUANT-checkpoint-3
          path: out/hype_v6_12h_segment_3_upload/caterpillar_quant
          if-no-files-found: warn
          retention-days: 2

  segment_4:
    needs: segment_3
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 195
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: |
          python -m pip install -r research/hype_local_v5/requirements-research.txt
          python -m pip install -r research/hype_quant/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: HYPE-CATERPILLAR-QUANT-checkpoint-3
          path: cq_warm
      - name: Capture and compact segment 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATERPILLAR_STATUS_ISSUE: "24"
          CATERPILLAR_WARMSTART_DIR: cq_warm
        run: bash research/hype_local_v5/capture_pack_segment.sh out/hype_v6_12h_segment_4 "$CAPTURE_MINUTES"
      - name: Upload compact segment 4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-H1-V6-12H-segment-4
          path: out/hype_v6_12h_segment_4_upload
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - name: Upload Caterpillar Quant checkpoint 4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-CATERPILLAR-QUANT-checkpoint-4
          path: out/hype_v6_12h_segment_4_upload/caterpillar_quant
          if-no-files-found: warn
          retention-days: 2

  combine:
    needs: segment_4
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download compact segment artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: HYPE-H1-V6-12H-segment-*
          path: downloaded
      - uses: actions/download-artifact@v4
        with:
          name: HYPE-CATERPILLAR-QUANT-checkpoint-4
          path: cq_final
      - name: Build manifest-only combined index
        run: |
          mkdir -p combined_index
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("downloaded")
          rows=[]
          schemas=[]
          for p in sorted(root.rglob("PACK_MANIFEST.json")):
              m=json.loads(p.read_text())
              rows.append({
                  "artifact_dir":str(p.parent),
                  "format_version":m.get("format_version"),
                  "source_bytes":m.get("source_bytes"),
                  "packed_bytes":m.get("packed_bytes"),
                  "compression_ratio":m.get("compression_ratio"),
                  "all_110_supported":m.get("all_110_supported"),
                  "canonical_point_count":m.get("canonical_point_count"),
                  "chunks":m.get("chunks",[]),
              })
              s=p.parent/"SCHEMA_110.json"
              if s.exists(): schemas.append(json.loads(s.read_text()))
          total=sum((x.get("packed_bytes") or 0) for x in rows)
          out={"research_only":True,"symbol":"HYPEUSDT","segments":rows,
               "packed_bytes_total":total,"target_note":"12h compact package target <100 MB on measured reference; activity dependent.",
               "no_payload_duplication":True}
          Path("combined_index/HYPE_12H_RESEARCH_MANIFEST.json").write_text(json.dumps(out,indent=2)+"\n")
          if schemas:
              Path("combined_index/SCHEMA_110.json").write_text(json.dumps(schemas[0],indent=2)+"\n")
          PY
          cp research/hype_local_v5/decode_compact.py combined_index/decode_compact.py
      - name: Upload combined index only
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-H1-V6-12H-COMBINED-INDEX
          path: combined_index
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload durable Caterpillar Quant checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-CATERPILLAR-QUANT-CHECKPOINT
          path: cq_final
          if-no-files-found: error
          retention-days: 30


  restart_next:
    needs: combine
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Start next continuous HYPE collector chunk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Self-chaining next HYPE collector run..."
          gh workflow run hype-h1-v6-forward-12h.yml --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}"
