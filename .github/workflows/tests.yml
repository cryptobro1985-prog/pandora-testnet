name: Active Pump and Local release tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: paper_test
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: paper_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paper_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://paper_test:isolated_test_only@localhost:5432/paper_test
      PANDORA_TEST_DATABASE_URL_FILE: /tmp/pandora-ci-db-url
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Initialize isolated PostgreSQL schema
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import app
          Path(os.environ["PANDORA_TEST_DATABASE_URL_FILE"]).write_text(os.environ["DATABASE_URL"])
          app.pinit()
          PY
      - name: Compile active runtime
        run: python -m py_compile app.py local_caterpillar.py hype_h1_swing.py momentum_scanner.py market_data.py market_stream.py accounting.py engine_store.py hyperliquid_transport.py
      - name: Run active strategy release suite
        run: |
          python -m unittest -v \
            tests.test_accounting \
            tests.test_h1_direction_m15_execution \
            tests.test_hyperliquid_transport \
            tests.test_local_caterpillar \
            tests.test_local_v11_regressions \
            tests.test_market_data \
            tests.test_momentum_audit \
            tests.test_regime_v6 \
            tests.test_release_gates_20261027 \
            tests.test_strategy_roi \
            tests.test_strategy_stats \
            tests.test_ws_mid_prices
      - name: Package source backup
        if: always()
        run: |
          zip -qr "PANDORA_${GITHUB_SHA}.zip" . -x ".git/*" "PANDORA_${GITHUB_SHA}.zip"
      - name: Upload source backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PANDORA-source-${{ github.sha }}
          path: PANDORA_${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 30
