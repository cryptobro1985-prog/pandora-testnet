name: PAPER regression tests

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pandora
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: pandora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pandora -d pandora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pandora:local-ci-only@127.0.0.1:5432/pandora_test
      PANDORA_TEST_DATABASE_URL_FILE: /tmp/pandora-test-database-url
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run the complete suite against an isolated database
        run: |
          printf '%s\n' "$DATABASE_URL" > "$PANDORA_TEST_DATABASE_URL_FILE"
          python scripts/run_release_tests.py --report /tmp/release-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-regression-results
          path: /tmp/release-result.json
