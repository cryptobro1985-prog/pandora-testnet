name: Paper engine regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: paper_test
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: paper_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paper_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://paper_test:isolated_test_only@localhost:5432/paper_test
      PANDORA_TEST_DATABASE_URL_FILE: /tmp/pandora-ci-db-url
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Initialize isolated PostgreSQL schema
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import app
          Path(os.environ["PANDORA_TEST_DATABASE_URL_FILE"]).write_text(os.environ["DATABASE_URL"])
          app.pinit()
          PY
      - run: python -m unittest discover -s tests -v
