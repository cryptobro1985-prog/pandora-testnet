name: HYPE Unified 30D Agent Quant

on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - research/hype_quant/agents.py
      - research/hype_quant/bootstrap_30d_unified.py
      - research/hype_quant/learner.py
      - research/hype_quant/config.json
      - .github/workflows/hype-unified-30d.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hype-unified-30d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quant dependencies
        run: |
          python -m pip install -r research/hype_quant/requirements.txt
          python -m py_compile research/hype_quant/agents.py research/hype_quant/bootstrap_30d_unified.py research/hype_quant/learner.py
      - name: Download latest verified HYPE 30D compact artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hist
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts | map(select((.expired|not) and .name=="local116-HYPE")) | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "$ID"
          echo "Using local116-HYPE artifact $ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$ID/zip" > hist.zip
          unzip -q hist.zip -d hist
          test -f hist/compact_1m.jsonl.gz
          test -f hist/candidate_snapshots.jsonl.gz
          test -f hist/manifest.json
      - name: Train agents + Quant and freeze dynamic policy
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p out
          python -m research.hype_quant.bootstrap_30d_unified \
            --artifact-root hist \
            --output out
          test -f out/quant_learner.pkl
          test -f out/UNIFIED_30D_REPORT.json
          test -f out/UNIFIED_POLICY.json
      - name: Upload unified historical warmstart
        uses: actions/upload-artifact@v4
        with:
          name: HYPE-UNIFIED-30D-WARMSTART
          path: out/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
