name: Only Profit Continuous Search

on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - "research/only_profit/**"
      - ".github/workflows/only-profit-continuous.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: only-profit-continuous-v4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: |
          python -m pip install -r research/hype_quant/requirements.txt
          python -m pip install msgpack
          python -m py_compile research/only_profit/*.py
      - name: Download 30d HYPE history and durable/fallback 24h full116
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/historical input/live

          HIST_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts | map(select((.expired|not) and .name=="local116-HYPE")) | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "$HIST_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$HIST_ID/zip" > hist.zip
          unzip -q hist.zip -d input/historical
          test -f input/historical/compact_1m.jsonl.gz
          test -f input/historical/candidate_snapshots.jsonl.gz

          LIVE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts | map(select((.expired|not) and .name=="HYPE-ONLY-PROFIT-24H-FULL116")) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "${LIVE_ID:-}" ]; then
            echo "Using durable 24h full116 artifact $LIVE_ID"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$LIVE_ID/zip" > live.zip
            unzip -q live.zip -d input/live
          else
            echo "Durable artifact not ready; using verified source segment artifacts."
            fetch() {
              local id="$1"; local dest="$2"
              mkdir -p "$dest/package"
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" > /tmp/a.zip
              unzip -q /tmp/a.zip -d "$dest/package"
              rm /tmp/a.zip
              python research/hype_local_v5/decode_compact.py "$dest/package" --verify
            }
            fetch 13397539131 input/live/calibration/segment_1
            fetch 13408382406 input/live/calibration/segment_2
            fetch 13418992824 input/live/calibration/segment_3
            fetch 13434596251 input/live/calibration/segment_4
            fetch 13424674035 input/live/holdout/segment_1
            fetch 13437804738 input/live/holdout/segment_2
            fetch 13451001041 input/live/holdout/segment_3
            fetch 13462480997 input/live/holdout/segment_4
          fi

          mkdir -p previous
          STATE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts | map(select((.expired|not) and .name=="ONLY-PROFIT-SEARCH-STATE")) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "${STATE_ID:-}" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$STATE_ID/zip" > state.zip
            unzip -q state.zip -d previous || true
          fi
      - name: Build common causal dataset
        run: |
          mkdir -p dataset
          python -m research.only_profit.dataset \
            --historical-root input/historical \
            --live-root input/live \
            --output dataset
          if [ -f previous/SEARCH_STATE.json ]; then cp previous/SEARCH_STATE.json dataset/SEARCH_STATE.json; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ONLY-PROFIT-DATASET
          path: dataset/**
          if-no-files-found: error
          retention-days: 2
          compression-level: 6

  search:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        family: [trend_follow, pullback, local_reversal, liq_squeeze, absorption, hybrid]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r research/hype_quant/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: ONLY-PROFIT-DATASET
          path: dataset
      - name: Evolutionary search
        run: |
          mkdir -p out
          ARGS=()
          if [ -f dataset/SEARCH_STATE.json ]; then ARGS+=(--state dataset/SEARCH_STATE.json); fi
          python -m research.only_profit.search_family \
            --dataset-root dataset \
            --family "${{ matrix.family }}" \
            --round "${{ github.run_number }}" \
            --candidates 256 \
            --output out \
            "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: only-profit-${{ matrix.family }}
          path: out/**
          if-no-files-found: error
          retention-days: 7

  aggregate:
    needs: search
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: only-profit-*
          path: results
      - name: Aggregate round and persist genetic state
        run: |
          mkdir -p state
          python -m research.only_profit.aggregate \
            --root results \
            --output state \
            --round "${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ONLY-PROFIT-SEARCH-STATE
          path: state/**
          if-no-files-found: error
          retention-days: 90
      - name: Start next search round
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Only Profit round ${{ github.run_number }} complete; chaining next round."
          gh workflow run only-profit-continuous.yml --ref "${GITHUB_REF_NAME}"
