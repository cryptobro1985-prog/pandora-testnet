name: HYPE HARD120 Exact 30D Replay

on:
  workflow_dispatch:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - "research/hype_false_local_entry/replay_hard120_30d.py"
      - ".github/workflows/hype-hard120-replay.yml"

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore canonical 30D HYPE artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p history30
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=local116-HYPE" \
            --jq '.artifacts | map(select((.expired|not) and .name=="local116-HYPE")) | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "${ID}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > history30.zip
          unzip -q history30.zip -d history30
          test -s history30/compact_1m.jsonl.gz
          test -s history30/labels.json.gz
      - name: Reproduce exact HARD120 first-signal audit
        run: |
          python -m research.hype_false_local_entry.replay_hard120_30d \
            --compact-1m history30/compact_1m.jsonl.gz \
            --labels-gz history30/labels.json.gz \
            --output HARD120_EXACT_REPLAY.json \
            --assert-reference
          python - <<'PY'
          import json
          x=json.load(open("HARD120_EXACT_REPLAY.json"))
          m=x["evaluation"]
          print("precision",m["precision"],"recall",m["recall"],"true",m["true_first"],"false",m["false_first"])
          assert m["precision"]>0.92
          assert m["recall"]>0.44
          assert all(b["recall"]>=0.40 for b in x["chronological_blocks"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HYPE-HARD120-EXACT-REPLAY-${{ github.run_id }}
          path: HARD120_EXACT_REPLAY.json
          retention-days: 14
