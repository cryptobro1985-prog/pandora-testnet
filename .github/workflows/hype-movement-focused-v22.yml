name: HYPE Movement Focused V2.2
on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - 'research/hype_movement_signature/replay_focused_v22.py'
      - '.github/workflows/hype-movement-focused-v22.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: hype-movement-focused-v22
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 0
      - run: python -m pip install numpy pandas scikit-learn
      - uses: actions/download-artifact@v4
        with:
          name: HYPE-HISTORY-20260712-20261103-MASTER
          path: /tmp/hype_master
          run-id: 42564417286
          github-token: ${{ github.token }}
      - run: |
          rm -rf /tmp/focused
          python -m research.hype_movement_signature.replay_focused_v22 --master-root /tmp/hype_master --out /tmp/focused
      - run: |
          set -euo pipefail
          git pull --rebase origin research/hype-h1-local-v5-oi-microstructure-20261104
          rm -rf research/hype_movement_signature/results_focused_v22
          mkdir -p research/hype_movement_signature/results_focused_v22
          cp /tmp/focused/* research/hype_movement_signature/results_focused_v22/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/hype_movement_signature/results_focused_v22
          if ! git diff --cached --quiet; then
            git commit -m "Add focused movement V2.2 results"
            git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104
          fi
