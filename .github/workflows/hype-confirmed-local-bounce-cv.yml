name: HYPE Confirmed Local Bounce CV

on:
  workflow_dispatch:
    inputs:
      decision_sampling:
        description: "Causal decision observation clock"
        type: choice
        required: true
        default: completed_m1_events
        options:
          - legacy_age_grid
          - completed_m1_events
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - ".github/workflows/hype-confirmed-local-bounce-cv.yml"
      - "research/hype_false_local_entry/confirmed_local_bounce_cv.py"

permissions:
  contents: write
  actions: read

jobs:
  cv:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scikit-learn
      - name: Regression tests before costly CV
        run: |
          python -m unittest research.hype_false_local_entry.test_confirmed_bounce_contract research.hype_false_local_entry.test_causal_decision_bars
      - name: Download all-period master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p in out
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/13650399622/zip" > in/master.zip
      - name: Evaluate confirmed Local then bounce-entry objective
        run: |
          python -m research.hype_false_local_entry.confirmed_local_bounce_cv \
            --master in/master.zip \
            --decision-sampling "${{ inputs.decision_sampling || 'completed_m1_events' }}" \
            --output out/HYPE_CONFIRMED_LOCAL_BOUNCE_CV.json | tee out/run.log
      - name: Validate causal CV output contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("out/HYPE_CONFIRMED_LOCAL_BOUNCE_CV.json").read_text())
          assert d["real_orders"] is False and d["time_gate"] is False
          assert d["decision_sampling"] == "${{ inputs.decision_sampling || 'completed_m1_events' }}"
          assert set(d["by_side"]) == {"LOW","HIGH"}
          for side in ("LOW","HIGH"):
              folds=d["by_side"][side]["folds"]
              assert len(folds)==4 and len({f["holdout"] for f in folds})==4
              for f in folds:
                  assert all(f["holdout"] not in x["fit_periods"] for x in f["inner_oof_folds"])
                  assert "false_adverse_p90_bps" in f["test"]
          print("Confirmed bounce causal CV contract passed")
          PY
      - name: Publish
        run: |
          mkdir -p research/hype_false_local_entry/results
          cp out/HYPE_CONFIRMED_LOCAL_BOUNCE_CV.json \
             research/hype_false_local_entry/results/HYPE_CONFIRMED_LOCAL_BOUNCE_CV.json
          git config user.name "pandora-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/hype_false_local_entry/results/HYPE_CONFIRMED_LOCAL_BOUNCE_CV.json
          git commit -m "research: publish confirmed Local bounce-entry CV [skip ci]" || true
          git pull --rebase origin research/hype-h1-local-v5-oi-microstructure-20261104
          git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104
