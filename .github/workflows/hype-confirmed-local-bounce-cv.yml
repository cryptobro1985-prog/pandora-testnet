name: HYPE Confirmed Local Bounce CV

on:
  workflow_dispatch:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - ".github/workflows/hype-confirmed-local-bounce-cv.yml"

permissions:
  contents: write
  actions: read

jobs:
  cv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scikit-learn
      - name: Download all-period master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p in out
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/13650399622/zip" > in/master.zip
      - name: Evaluate confirmed Local then bounce-entry objective
        run: |
          python -m research.hype_false_local_entry.confirmed_local_bounce_cv \
            --master in/master.zip \
            --output out/HYPE_CONFIRMED_LOCAL_BOUNCE_CV.json | tee out/run.log
      - name: Publish
        run: |
          mkdir -p research/hype_false_local_entry/results
          cp out/HYPE_CONFIRMED_LOCAL_BOUNCE_CV.json \
             research/hype_false_local_entry/results/HYPE_CONFIRMED_LOCAL_BOUNCE_CV.json
          git config user.name "pandora-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/hype_false_local_entry/results/HYPE_CONFIRMED_LOCAL_BOUNCE_CV.json
          git commit -m "research: publish confirmed Local bounce-entry CV [skip ci]" || true
          git pull --rebase origin research/hype-h1-local-v5-oi-microstructure-20261104 || true
          git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104 || true
