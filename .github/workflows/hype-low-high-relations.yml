name: HYPE LOW-HIGH Full-Contract Relations

on:
  workflow_dispatch:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - "research/hype_full_micro_202607/find_low_high_relations.py"
      - ".github/workflows/hype-low-high-relations.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: hype-low-high-relations
  cancel-in-progress: true

jobs:
  relations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research stack
        run: python -m pip install numpy scikit-learn

      - name: Download completed full-micro dataset
        uses: actions/download-artifact@v4
        with:
          name: HYPE-FULL-MICRO-202607-DATA-42376949791
          path: full_micro_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 42376949791

      - name: Locate snapshots
        shell: bash
        run: |
          set -euo pipefail
          SNAP="$(find full_micro_artifact -name candidate_snapshots_full_micro.jsonl.gz -print -quit)"
          test -n "$SNAP"
          echo "SNAPSHOTS=$SNAP" >> "$GITHUB_ENV"

      - name: Find one relation for LOW and one for HIGH
        run: |
          python -m research.hype_full_micro_202607.find_low_high_relations \
            --snapshots "$SNAPSHOTS" \
            --out relation_out | tee relation_search.log
          test -s relation_out/LOW_HIGH_RELATIONS_LATEST.json

      - name: Publish relation result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/hype_full_micro_202607/results
          cp relation_out/LOW_HIGH_RELATIONS_LATEST.json research/hype_full_micro_202607/results/LOW_HIGH_RELATIONS_LATEST.json
          git config user.name "pandora-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/hype_full_micro_202607/results/LOW_HIGH_RELATIONS_LATEST.json
          git commit -m "research(hype): publish full-contract LOW/HIGH relations [skip ci]" || true
          git pull --rebase origin research/hype-h1-local-v5-oi-microstructure-20261104 || true
          git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104 || true

      - uses: actions/upload-artifact@v4
        with:
          name: HYPE-LOW-HIGH-RELATIONS-${{ github.run_id }}
          path: |
            relation_out/**
            relation_search.log
          retention-days: 30
