name: HYPE All-Local First-Signal CV

on:
  workflow_dispatch:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - ".github/workflows/hype-all-local-first-signal-cv.yml"

permissions:
  contents: write
  actions: read

jobs:
  cv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scikit-learn
      - name: Download master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fs_in fs_out
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/13650399622/zip" > fs_in/master.zip
      - name: Cross-validate first-signal signature
        run: |
          python -m research.hype_false_local_entry.all_local_first_signal_cv \
            --master fs_in/master.zip \
            --output fs_out/HYPE_ALL_LOCAL_FIRST_SIGNAL_CV.json | tee fs_out/run.log
      - name: Publish
        run: |
          mkdir -p research/hype_false_local_entry/results
          cp fs_out/HYPE_ALL_LOCAL_FIRST_SIGNAL_CV.json \
            research/hype_false_local_entry/results/HYPE_ALL_LOCAL_FIRST_SIGNAL_CV.json
          git config user.name "pandora-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/hype_false_local_entry/results/HYPE_ALL_LOCAL_FIRST_SIGNAL_CV.json
          git commit -m "research: publish all-local first-signal CV [skip ci]" || true
          git pull --rebase origin research/hype-h1-local-v5-oi-microstructure-20261104 || true
          git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104 || true
