name: HYPE Persistence Full Stack Development Replay

on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - "research/hype_false_local_entry/hard120_persistence_shadow.py"
      - "research/hype_false_local_entry/replay_persistence_full_stack.py"
      - ".github/workflows/hype-persistence-development-replay.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore development periods only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p octnov julaug
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=local116-HYPE" --jq '.artifacts | map(select((.expired|not) and .name=="local116-HYPE")) | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "$ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > octnov.zip
          unzip -q octnov.zip -d octnov
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/13585701406/zip" > julaug.zip
          unzip -q julaug.zip -d julaug
      - name: Replay pre-registered persistence challenger
        run: |
          python -m research.hype_false_local_entry.replay_persistence_full_stack             --compact-1m octnov/compact_1m.jsonl.gz             --labels-gz octnov/labels.json.gz             --output OCTNOV_PERSISTENCE_STACK.json
          python -m research.hype_false_local_entry.replay_persistence_full_stack             --compact-1m julaug/full_micro_out/compact_1m.jsonl.gz             --labels-gz julaug/full_micro_out/labels.json.gz             --derive-internal             --output JULAUG_PERSISTENCE_STACK.json
          python - <<'PY'
          import json
          a=json.load(open("OCTNOV_PERSISTENCE_STACK.json"))
          b=json.load(open("JULAUG_PERSISTENCE_STACK.json"))
          print("OCTNOV",a["evaluation"],a["by_side"])
          print("JULAUG",b["evaluation"],b["by_side"])
          for x in (a,b):
              assert x["contracts"]["persistence"]["min_reversal_persistence"]==0.65
              assert x["contracts"]["core_flip_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HYPE-PERSISTENCE-DEVELOPMENT-${{ github.run_id }}
          path: |
            OCTNOV_PERSISTENCE_STACK.json
            JULAUG_PERSISTENCE_STACK.json
          retention-days: 14
