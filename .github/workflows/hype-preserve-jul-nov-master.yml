name: Preserve HYPE Jul-Nov Historical Master

on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - ".github/workflows/hype-preserve-jul-nov-master.yml"
      - "research/hype_historical_master/build_master.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-master:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Assemble every preserved Jul-Nov HYPE block
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="HYPE_HISTORY_20260712_20261103_MASTER"
          mkdir -p "$ROOT/01_JUL12_AUG07_FULL_MICRO" "$ROOT/02_AUG08_SEP01" "$ROOT/03_SEP01_OCT01" "$ROOT/04_OCT04_NOV03" "$ROOT/_source_artifacts"

          fetch() {
            id="$1"
            out="$2"
            dest="$3"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$ROOT/_source_artifacts/$out"
            mkdir -p "$dest"
            unzip -q "$ROOT/_source_artifacts/$out" -d "$dest"
          }

          fetch 13585701406 jul12_aug07_full_micro.zip /tmp/julaug
          cp -a /tmp/julaug/full_micro_out/. "$ROOT/01_JUL12_AUG07_FULL_MICRO/"

          fetch 13638795292 aug08_sep01.zip /tmp/lateaug
          cp -a /tmp/lateaug/. "$ROOT/02_AUG08_SEP01/"

          fetch 13637558401 sep01_oct01.zip /tmp/sep
          cp -a /tmp/sep/_temp/hype-sep-out/. "$ROOT/03_SEP01_OCT01/"
          cp -a /tmp/sep/pandora-testnet/pandora-testnet/SEPTEMBER_UNTOUCHED_RESULT.json "$ROOT/03_SEP01_OCT01/" || true
          cp -a /tmp/sep/pandora-testnet/pandora-testnet/SEPTEMBER_HARD120_ONLY.json "$ROOT/03_SEP01_OCT01/" || true
          cp -a /tmp/sep/pandora-testnet/pandora-testnet/SEPTEMBER_FULL_STACK.json "$ROOT/03_SEP01_OCT01/" || true

          fetch 13435356156 oct04_nov03.zip /tmp/octnov
          cp -a /tmp/octnov/. "$ROOT/04_OCT04_NOV03/"

          python research/hype_historical_master/build_master.py --root "$ROOT"
          test -s "$ROOT/MASTER_INDEX.json"
          du -sh "$ROOT"

      - uses: actions/upload-artifact@v4
        with:
          name: HYPE-HISTORY-20260712-20261103-MASTER
          path: HYPE_HISTORY_20260712_20261103_MASTER/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
