name: HYPE Dense Sequential Cross-Period Now

on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - ".github/workflows/hype-dense-cross-period-now.yml"
      - "research/hype_false_local_entry/causal_sequential_engine.py"
      - "research/hype_false_local_entry/dense_causal_reachability.py"
      - "research/hype_false_local_entry/replay_dense_first_signal.py"
      - "research/hype_false_local_entry/search_dense_post_local_gate.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore Oct-Nov and Jul-Aug artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p octnov julaug/raw julaug
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=local116-HYPE" --jq '.artifacts | map(select((.expired|not) and .name=="local116-HYPE")) | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "$ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > octnov.zip
          unzip -q octnov.zip -d octnov
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/13585701406/zip" > julaug.zip
          unzip -q julaug.zip -d julaug/raw
          cp julaug/raw/full_micro_out/compact_1m.jsonl.gz julaug/compact_1m.jsonl.gz
          cp julaug/raw/full_micro_out/labels.json.gz julaug/legacy_labels.json.gz
          test -s octnov/compact_1m.jsonl.gz
          test -s octnov/labels.json.gz
          test -s julaug/compact_1m.jsonl.gz
      - name: Inspect original Jul-Aug teacher scopes
        run: |
          python - <<'PY'
          import gzip,json
          with gzip.open("julaug/legacy_labels.json.gz","rt",encoding="utf-8") as f:
              doc=json.load(f)
          for scope in ("internal","strict"):
              rows=[x for x in doc.get(scope,[]) if x.get("reference_finalized")]
              sides={s:sum(x.get("side",x.get("type"))==s for x in rows) for s in ("LOW","HIGH")}
              print("julaug_legacy",scope,"finalized",len(rows),"sides",sides)
          PY
      - name: Prepare strict Jul-Aug teacher with archive-edge censor
        run: |
          python - <<'PY'
          import gzip,json
          src="julaug/legacy_labels.json.gz"
          dst="julaug/labels.json.gz"
          with gzip.open(src,"rt",encoding="utf-8") as f:
              doc=json.load(f)
          strict=[x for x in doc.get("strict",[]) if x.get("reference_finalized")]
          censored=[x for x in strict if int(x.get("label_id",-1))==1]
          kept=[x for x in strict if int(x.get("label_id",-1))!=1]
          sides={s:sum(x.get("side",x.get("type"))==s for x in kept) for s in ("LOW","HIGH")}
          if len(censored)!=1 or len(kept)!=46 or sides!={"LOW":23,"HIGH":23}:
              raise ValueError(f"unexpected Jul-Aug censor contract: censored={len(censored)} kept={len(kept)} sides={sides}")
          with gzip.open(dst,"wt",encoding="utf-8") as f:
              json.dump({"internal":[],"strict":kept},f,separators=(",",":"))
          print("julaug_censored_label_ids",[x.get("label_id") for x in censored])
          print("julaug_strict_evaluable",len(kept),sides)
          PY
      - name: Replay same causal engine on both strict periods
        run: |
          python -m research.hype_false_local_entry.replay_dense_first_signal \
            --base-dir octnov --out OCTNOV_DENSE.json --scope strict \
            --expected-total 76 --expected-low 38 --expected-high 38 --expected-swings 75
          python -m research.hype_false_local_entry.replay_dense_first_signal \
            --base-dir julaug --out JULAUG_DENSE.json --scope strict \
            --expected-total 46 --expected-low 23 --expected-high 23 --expected-swings 45
          python - <<'PY'
          import json
          for name in ("OCTNOV_DENSE.json","JULAUG_DENSE.json"):
              x=json.load(open(name))
              m=x["first_signal"]["strict"]
              print(name, json.dumps({
                  "locals":m["finalized_locals"],
                  "swings":m["complete_swings"],
                  "detected":m["detected_locals"],
                  "wrong_first":m["completed_swing_wrong_first"],
                  "true_first":m["completed_swing_true_first"],
                  "swing_recall":m["completed_swing_recall"],
                  "median_lag_ms":m["completed_swing_median_lag_ms"],
                  "entry_bps":m["completed_swing_median_entry_distance_bps"],
                  "remaining":m["completed_swing_median_remaining_swing_fraction"],
                  "adverse_bps":m["completed_swing_median_adverse_extension_bps"],
              },separators=(",",":")))
          PY
      - name: Search causal post-local veto on Jul-Aug and freeze on Oct-Nov
        run: |
          python -m research.hype_false_local_entry.search_dense_post_local_gate \
            --dev-dir julaug --test-dir octnov --out DENSE_POST_LOCAL_GATE_SEARCH.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HYPE-DENSE-CROSS-PERIOD-${{ github.run_id }}
          path: |
            OCTNOV_DENSE.json
            JULAUG_DENSE.json
            DENSE_POST_LOCAL_GATE_SEARCH.json
          retention-days: 14
