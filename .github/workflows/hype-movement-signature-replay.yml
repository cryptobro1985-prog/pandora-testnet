name: HYPE Movement Signature Common Replay

on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - '.github/workflows/hype-movement-signature-replay.yml'
      - 'research/hype_movement_signature/replay_common.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 0

      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn

      - name: Download historical master
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/hype_master/unpacked
          gh api repos/\${GITHUB_REPOSITORY}/actions/artifacts/13650399622/zip > /tmp/hype_master/master.zip
          unzip -q /tmp/hype_master/master.zip -d /tmp/hype_master/unpacked

      - name: Run movement replay
        run: |
          set -euo pipefail
          rm -rf research/hype_movement_signature/results_common
          python research/hype_movement_signature/replay_common.py \
            --master-root /tmp/hype_master/unpacked \
            --out research/hype_movement_signature/results_common

      - name: Commit replay outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/hype_movement_signature/results_common
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Add movement-signature chronological replay results"
            git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104
          fi
