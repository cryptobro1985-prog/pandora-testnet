name: HYPE Nov Rich Gate Fast

on:
  push:
    branches: [research/hype-h1-local-v5-oi-microstructure-20261104]
    paths:
      - "research/hype_movement_signature/nov_rich_gate_fast.py"
      - ".github/workflows/hype-nov-rich-gate-fast.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAW_ARTIFACT_ID: "13723739486"
      REPLAY_START: "2026-11-08T00:00:00+00:00"
      REPLAY_END: "2026-11-10T00:00:00+00:00"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install numpy pandas pyarrow polars requests zstandard
      - name: Restore raw cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/raw /tmp/cache /tmp/recent
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${RAW_ARTIFACT_ID}/zip" > /tmp/raw.zip
          unzip -q /tmp/raw.zip -d /tmp/raw
          cp -a /tmp/raw/cache/. /tmp/cache/
      - name: Build compact
        run: |
          python -m research.hype_movement_signature.build_recent_compact_from_cache             --start "${REPLAY_START}" --end "${REPLAY_END}"             --cache /tmp/cache --output /tmp/recent/compact_1m.jsonl.gz --workers 32
      - name: Score rich gates fast
        run: |
          rm -rf /tmp/richfast
          python -m research.hype_movement_signature.nov_rich_gate_fast             --compact /tmp/recent/compact_1m.jsonl.gz --cache /tmp/cache --out /tmp/richfast
          cat /tmp/richfast/NOV_RICH_GATE_FAST_REPORT.json
      - name: Publish
        run: |
          git fetch origin research/hype-h1-local-v5-oi-microstructure-20261104
          git reset --hard origin/research/hype-h1-local-v5-oi-microstructure-20261104
          rm -rf research/hype_movement_signature/results_nov_rich_fast
          mkdir -p research/hype_movement_signature/results_nov_rich_fast
          cp /tmp/richfast/* research/hype_movement_signature/results_nov_rich_fast/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/hype_movement_signature/results_nov_rich_fast
          if ! git diff --cached --quiet; then
            git commit -m "research(hype): publish Nov rich-gate fast audit"
            git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104
          fi
