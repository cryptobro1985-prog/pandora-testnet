name: HYPE Risk Aligned Fresh OOS

on:
  push:
    branches: [research/hype-h1-local-v5-oi-microstructure-20261104]
    paths:
      - "research/hype_movement_signature/risk_aligned_fresh_oos.py"
      - ".github/workflows/hype-risk-aligned-fresh-oos.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: hype-risk-aligned-fresh-oos
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CRYPTOHFTDATA_API_KEY: ${{ secrets.CRYPTOHFTDATA_API_KEY }}
      START: "2026-11-10T00:00:00+00:00"
      END: "2026-11-10T18:30:00+00:00"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install numpy pandas polars pyarrow requests zstandard
      - name: Score risk-aligned triggers on fresh window
        run: |
          rm -rf /tmp/risk_oos /tmp/risk_cache
          mkdir -p /tmp/risk_oos /tmp/risk_cache
          python -m research.hype_movement_signature.risk_aligned_fresh_oos             --start "${START}" --end "${END}" --cache /tmp/risk_cache --out /tmp/risk_oos
          cat /tmp/risk_oos/RISK_ALIGNED_FRESH_OOS_REPORT.json
      - name: Publish
        run: |
          set -euo pipefail
          git fetch origin research/hype-h1-local-v5-oi-microstructure-20261104
          git reset --hard origin/research/hype-h1-local-v5-oi-microstructure-20261104
          rm -rf research/hype_movement_signature/results_risk_aligned_fresh
          mkdir -p research/hype_movement_signature/results_risk_aligned_fresh
          cp /tmp/risk_oos/* research/hype_movement_signature/results_risk_aligned_fresh/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/hype_movement_signature/results_risk_aligned_fresh
          if ! git diff --cached --quiet; then
            git commit -m "research(hype): publish risk-aligned fresh OOS"
            git pull --rebase origin research/hype-h1-local-v5-oi-microstructure-20261104
            git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104
          fi
