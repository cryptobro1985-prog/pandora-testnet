name: Local 116 30D Ten Token Research

on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - research/local_116_30d/**
      - .github/workflows/local-116-30d.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and contract smoke
        run: |
          python -m py_compile research/local_116_30d/run_symbol.py research/local_116_30d/aggregate.py
          python - <<'PY'
          from research.hype_quant.feature_contract import POINTS
          assert len(POINTS)==116
          from research.caterpillar.caterpillar.model import SYMBOLS
          assert len(SYMBOLS)==10
          print("smoke_ok", SYMBOLS)
          PY

  research:
    needs: smoke
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        symbol: [ZEC, HYPE, NEAR, SOL, ENA, 1000PEPE, DOGE, SUI, AAVE, WLD]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run 30D local research with ephemeral raw cache
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/local116-cache/${{ matrix.symbol }}" "$RUNNER_TEMP/local116-out/${{ matrix.symbol }}"
          python research/local_116_30d/run_symbol.py \
            --symbol "${{ matrix.symbol }}" \
            --cache "$RUNNER_TEMP/local116-cache/${{ matrix.symbol }}" \
            --output "$RUNNER_TEMP/local116-out/${{ matrix.symbol }}"
          test -z "$(find "$RUNNER_TEMP/local116-cache/${{ matrix.symbol }}" -type f -name '*.csv.gz' -print -quit)"
      - name: Upload compact research artifact
        uses: actions/upload-artifact@v4
        with:
          name: local116-${{ matrix.symbol }}
          path: ${{ runner.temp }}/local116-out/${{ matrix.symbol }}/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  aggregate:
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: local116-*
          path: ${{ runner.temp }}/local116-all
      - name: Build pooled cross-token local engine
        run: |
          mkdir -p "$RUNNER_TEMP/local116-global"
          python research/local_116_30d/aggregate.py \
            --root "$RUNNER_TEMP/local116-all" \
            --output "$RUNNER_TEMP/local116-global"
      - name: Upload global local engine
        uses: actions/upload-artifact@v4
        with:
          name: local116-global-model
          path: ${{ runner.temp }}/local116-global/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
