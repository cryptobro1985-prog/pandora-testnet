name: HYPE September Persistence Untouched Replay

on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - ".github/workflows/hype-september-persistence-untouched.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore untouched September artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p sep
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/13637558401/zip" > sep.zip
          unzip -q sep.zip -d sep
          C="$(find sep -name compact_1m.jsonl.gz -print -quit)"
          L="$(find sep -name labels.json.gz -print -quit)"
          test -n "$C"; test -n "$L"
          cp "$C" sep/compact_1m.jsonl.gz
          cp "$L" sep/labels.json.gz
      - name: Replay pre-registered persistence stack
        run: |
          python -m research.hype_false_local_entry.replay_persistence_full_stack             --compact-1m sep/compact_1m.jsonl.gz             --labels-gz sep/labels.json.gz             --output SEPTEMBER_PERSISTENCE_STACK.json
          python - <<'PY'
          import json
          x=json.load(open("SEPTEMBER_PERSISTENCE_STACK.json"))
          e=x["evaluation"]; h=x["by_side"]["HIGH"]; l=x["by_side"]["LOW"]
          print("SEPTEMBER_PERSISTENCE",json.dumps(e,separators=(",",":")))
          print("SEPTEMBER_PERSISTENCE_HIGH",json.dumps(h,separators=(",",":")))
          print("SEPTEMBER_PERSISTENCE_LOW",json.dumps(l,separators=(",",":")))
          out={
            "source_artifact":13637558401,
            "period":"2026-09-01..2026-10-01",
            "rule_frozen_before_holdout":True,
            "min_reversal_persistence":0.65,
            "evaluation":e,"HIGH":h,"LOW":l,
            "high_gate_80_40":h["precision"]>=0.80 and h["recall"]>=0.40,
            "overall_gate_80_40":e["precision"]>=0.80 and e["recall"]>=0.40,
            "real_orders":False,
          }
          open("SEPTEMBER_PERSISTENCE_UNTOUCHED_RESULT.json","w").write(json.dumps(out,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HYPE-SEPTEMBER-PERSISTENCE-${{ github.run_id }}
          path: |
            SEPTEMBER_PERSISTENCE_STACK.json
            SEPTEMBER_PERSISTENCE_UNTOUCHED_RESULT.json
          retention-days: 14
