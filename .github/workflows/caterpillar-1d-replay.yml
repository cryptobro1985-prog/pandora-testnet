name: Caterpillar 1D Tick Replay
on:
  push:
    branches: [caterpillar-paper-runtime-v1]
    paths: ['.github/workflows/caterpillar-1d-replay.yml']
permissions:
  contents: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        symbol: [AAVE, DOGE, SUI, WLD, 1000PEPE]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r research/caterpillar/requirements-lock.txt
      - name: Fetch only 2 Nov ticks and run causal research
        working-directory: research/caterpillar
        run: |
          mkdir -p "$RUNNER_TEMP/cache" "$RUNNER_TEMP/run"
          python -m caterpillar historical_research --symbols "${{ matrix.symbol }}" --start-date 2026-11-02 --end-date 2026-11-03 --cache "$RUNNER_TEMP/cache" --output "$RUNNER_TEMP/run"
      - name: Upload one-day evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caterpillar-1d-${{ matrix.symbol }}
          path: ${{ runner.temp }}/run/**
          retention-days: 7
          compression-level: 6
