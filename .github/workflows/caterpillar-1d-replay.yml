name: Caterpillar 1D Tick Replay
on:
  push:
    branches: [caterpillar-paper-runtime-v1]
    paths: ['scripts/caterpillar_historical_paper_1d.py', '.github/workflows/caterpillar-1d-replay.yml']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r research/caterpillar/requirements-lock.txt
      - name: Replay 2 Nov five-token PAPER account
        run: PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/research/caterpillar" python scripts/caterpillar_historical_paper_1d.py --cache "$RUNNER_TEMP/cache" --output "$RUNNER_TEMP/result"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caterpillar-paper-1d-result
          path: |
            ${{ runner.temp }}/result/RESULT.json
            ${{ runner.temp }}/result/TRADES.json
            ${{ runner.temp }}/result/journal.jsonl
          if-no-files-found: warn
          retention-days: 14
