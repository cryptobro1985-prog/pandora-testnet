name: Caterpillar Research CI

on:
  push:
    branches:
      - research/caterpillar-full-research-v2
  workflow_dispatch:

jobs:
  research-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/caterpillar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Compile
        run: |
          python -m compileall -q caterpillar scripts tests
          python -m py_compile ../../app.py ../../caterpillar_research_launcher.py ../../legacy_cleanup.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
