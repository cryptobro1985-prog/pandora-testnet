name: HYPE Caterpillar Quant CI

on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - "research/hype_caterpillar_quant/**"
      - "research/hype_quant/astra_cortex.py"
      - "research/hype_quant/test_astra_cortex.py"
      - "research/hype_local_v5/capture_pack_segment.sh"
      - ".github/workflows/hype-caterpillar-quant-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r research/hype_quant/requirements.txt
      - name: Compile and smoke
        run: |
          python -m py_compile research/hype_quant/astra_cortex.py research/hype_caterpillar_quant/learner.py research/hype_caterpillar_quant/live_daemon.py
          python -m research.hype_quant.test_astra_cortex
          bash -n research/hype_local_v5/capture_pack_segment.sh
          python - <<'PY'
          from pathlib import Path
          from research.hype_caterpillar_quant.learner import new_from_config
          q=new_from_config(Path("research/hype_quant/config.json"))
          assert q.report()["version"]=="caterpillar-quant-v2"
          assert len(q.local_models)==6
          assert len(q.fib_models)==24
          fr=q._fib_report()
          assert fr["enabled"] is True
          assert set(fr["levels"])=={"R0.236","R0.382","R0.500","R0.618","R0.786","R1.000","E1.272","E1.618"}
          assert q.position is None
          print("CATERPILLAR_QUANT_CI=ok fib_heads=24")
          PY
