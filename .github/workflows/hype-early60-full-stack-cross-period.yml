name: HYPE EARLY60 Full Shadow Stack Cross-Period

on:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - "research/hype_false_local_entry/replay_early60_plus_hard_stack.py"
      - ".github/workflows/hype-early60-full-stack-cross-period.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore both periods
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p octnov julaug
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=local116-HYPE" --jq '.artifacts | map(select((.expired|not) and .name=="local116-HYPE")) | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "$ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > octnov.zip
          unzip -q octnov.zip -d octnov
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/13585701406/zip" > julaug.zip
          unzip -q julaug.zip -d julaug
      - name: Replay identical full shadow stack
        run: |
          python -m research.hype_false_local_entry.replay_early60_plus_hard_stack \
            --compact-1m octnov/compact_1m.jsonl.gz \
            --labels-gz octnov/labels.json.gz \
            --output OCTNOV_EARLY60_FULL_STACK.json
          python -m research.hype_false_local_entry.replay_early60_plus_hard_stack \
            --compact-1m julaug/full_micro_out/compact_1m.jsonl.gz \
            --labels-gz julaug/full_micro_out/labels.json.gz \
            --derive-internal \
            --output JULAUG_EARLY60_FULL_STACK.json
          python - <<'PY'
          import json
          a=json.load(open("OCTNOV_EARLY60_FULL_STACK.json"))
          b=json.load(open("JULAUG_EARLY60_FULL_STACK.json"))
          am=a["evaluation"];bm=b["evaluation"]
          print("OCTNOV",am)
          print("JULAUG",bm)
          print("OCTNOV_SIDES",a["by_side"])
          print("JULAUG_SIDES",b["by_side"])
          assert am["true_first"]==56 and am["false_first"]==4,am
          assert am["precision"]>0.93 and am["recall"]>0.46,am
          assert am["early60_signals"]==8 and am["early60_true"]==8 and am["early60_false"]==0,am
          assert bm["true_first"]==43 and bm["false_first"]==7,bm
          assert bm["precision"]>=0.86 and bm["recall"]>0.42,bm
          assert bm["early60_signals"]==9 and bm["early60_true"]==9 and bm["early60_false"]==0,bm
          assert a["contracts"]["core_flip_authorized"] is False
          assert b["contracts"]["core_flip_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HYPE-EARLY60-FULL-STACK-${{ github.run_id }}
          path: |
            OCTNOV_EARLY60_FULL_STACK.json
            JULAUG_EARLY60_FULL_STACK.json
          retention-days: 14
