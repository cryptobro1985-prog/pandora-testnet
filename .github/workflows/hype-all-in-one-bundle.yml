name: HYPE All-In-One Canonical Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - "research/hype_all_in_one/**"
      - ".github/workflows/hype-all-in-one-bundle.yml"

permissions:
  contents: write
  actions: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build May and June canonical sealed tapes
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p ALL_IN_ONE/data/2026-05 ALL_IN_ONE/data/2026-06
          python -m research.hype_full_micro_202605.build_base_may --cache "$RUNNER_TEMP/may-cache" --output ALL_IN_ONE/data/2026-05
          python -m research.hype_full_micro_202606.build_base_june --cache "$RUNNER_TEMP/june-cache" --output ALL_IN_ONE/data/2026-06

      - name: Recover canonical retained artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ALL_IN_ONE/artifacts ALL_IN_ONE/models
          fetch_latest_exact () {
            NAME="$1"; DEST="$2"
            ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=$NAME" --jq ".artifacts | map(select((.expired|not) and .name==\"$NAME\")) | sort_by(.created_at) | reverse | .[0].id // empty")"
            if [ -z "$ID" ]; then echo "MISSING exact artifact: $NAME"; return 0; fi
            mkdir -p "$DEST"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$ID/zip" > "$RUNNER_TEMP/a.zip"
            unzip -q "$RUNNER_TEMP/a.zip" -d "$DEST"
            echo "$NAME $ID" >> ALL_IN_ONE/ARTIFACT_IDS.txt
          }
          fetch_latest_prefix () {
            PREFIX="$1"; DEST="$2"
            ROW="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq ".artifacts | map(select((.expired|not) and (.name|startswith(\"$PREFIX\")))) | sort_by(.created_at) | reverse | .[0] | [.id,.name] | @tsv" 2>/dev/null || true)"
            if [ -z "$ROW" ] || [ "$ROW" = "null" ]; then echo "MISSING prefix artifact: $PREFIX"; return 0; fi
            ID="$(printf '%s' "$ROW" | cut -f1)"
            NAME="$(printf '%s' "$ROW" | cut -f2-)"
            mkdir -p "$DEST"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$ID/zip" > "$RUNNER_TEMP/a.zip"
            unzip -q "$RUNNER_TEMP/a.zip" -d "$DEST"
            echo "$NAME $ID" >> ALL_IN_ONE/ARTIFACT_IDS.txt
          }

          fetch_latest_exact "HYPE-HISTORY-20260712-20261103-MASTER" "ALL_IN_ONE/data/JUL-NOV-MASTER"
          fetch_latest_exact "local116-HYPE" "ALL_IN_ONE/data/LOCAL116"
          fetch_latest_exact "HYPE-LOCAL-HISTORICAL-GAPS" "ALL_IN_ONE/data/HISTORICAL-GAPS"
          fetch_latest_exact "HYPE-LOCAL-ONLY-CHECKPOINT" "ALL_IN_ONE/models/LOCAL-ONLY"
          fetch_latest_prefix "HYPE-LOCAL-ENSEMBLE-30D-" "ALL_IN_ONE/models/ENSEMBLE-30D"
          fetch_latest_prefix "HYPE-UNIFIED-LOCAL-INTELLIGENCE-V2-" "ALL_IN_ONE/models/UNIFIED-V2"

      - name: Preserve code, contracts, reports and provenance
        run: |
          set -euo pipefail
          mkdir -p ALL_IN_ONE/repository
          cp -a research/hype_all_in_one ALL_IN_ONE/repository/
          cp -a research/hype_quant ALL_IN_ONE/repository/
          cp -a research/hype_local_only ALL_IN_ONE/repository/
          cp -a research/hype_terminal_local_strategy ALL_IN_ONE/repository/
          cp -a research/hype_full_micro_202605 ALL_IN_ONE/repository/
          cp -a research/hype_full_micro_202606 ALL_IN_ONE/repository/
          cp -a research/hype_full_micro_202607 ALL_IN_ONE/repository/
          cp -a research/hype_full_micro_202608_late ALL_IN_ONE/repository/
          cp -a research/hype_full_micro_202609 ALL_IN_ONE/repository/
          cp -a research/hype_historical_master ALL_IN_ONE/repository/
          find ALL_IN_ONE -type f -print0 | sort -z | xargs -0 sha256sum > ALL_IN_ONE/SHA256SUMS.txt
          du -sh ALL_IN_ONE

      - name: Recover preserved Jul-Nov source blocks and current models for public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p PUBLIC_RELEASE
          fetch_zip () {
            ID="$1"; NAME="$2"
            echo "fetch artifact $ID -> $NAME"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$ID/zip" > "PUBLIC_RELEASE/$NAME"
          }

          # Historical source blocks used by the preserved master workflow.
          fetch_zip 13585701406 HYPE_JUL12_AUG07_FULL_MICRO.zip
          fetch_zip 13638795292 HYPE_AUG08_SEP01.zip
          fetch_zip 13637558401 HYPE_SEP01_OCT01.zip
          fetch_zip 13435356156 HYPE_OCT04_NOV03_LOCAL116.zip

          # Historical enrichment + latest trained models.
          fetch_zip 13533587104 HYPE_LOCAL_HISTORICAL_GAPS.zip
          fetch_zip 13841989968 HYPE_LOCAL_ENSEMBLE_30D.zip
          fetch_zip 13844968349 HYPE_LOCAL_ONLY_CHECKPOINT.zip
          fetch_zip 13929250672 HYPE_UNIFIED_LOCAL_INTELLIGENCE_V2.zip
          fetch_zip 13844693781 HYPE_LATEST_LOCAL_RAW.zip

          # May/June were freshly rebuilt in this run from public source data.
          tar -czf PUBLIC_RELEASE/HYPE_MAY_2026_CANONICAL.tar.gz -C ALL_IN_ONE/data/2026-05 .
          tar -czf PUBLIC_RELEASE/HYPE_JUNE_2026_CANONICAL.tar.gz -C ALL_IN_ONE/data/2026-06 .

          cp research/hype_all_in_one/README.md PUBLIC_RELEASE/README.md
          cp research/hype_all_in_one/MANIFEST.json PUBLIC_RELEASE/MANIFEST.json
          cp research/hype_all_in_one/PROMPT_FOR_OTHER_AI.md PUBLIC_RELEASE/PROMPT_FOR_OTHER_AI.md
          sha256sum PUBLIC_RELEASE/* > PUBLIC_RELEASE/SHA256SUMS.txt

      - name: Publish/update public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="hype-public-data-v1"
          TITLE="HYPE Public Research Data + Models v1"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target research/hype-h1-local-v5-oi-microstructure-20261104 --title "$TITLE" --notes "Public HYPE research bundle: May-Nov historical data, canonical 116-point datasets/enrichment, latest Local-Only/Ensemble/Unified models, manifests and external-AI handoff. Research only; no secrets or real-order credentials."
          fi
          gh release upload "$TAG" PUBLIC_RELEASE/* --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: HYPE-ALL-IN-ONE-${{ github.run_id }}
          path: |
            ALL_IN_ONE/**
            PUBLIC_RELEASE/**
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
