name: HYPE All-Local Relationship Atlas

on:
  workflow_dispatch:
  push:
    branches:
      - research/hype-h1-local-v5-oi-microstructure-20261104
    paths:
      - ".github/workflows/hype-all-local-relationship-atlas.yml"

permissions:
  contents: write
  actions: read

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hype-h1-local-v5-oi-microstructure-20261104
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research stack
        run: python -m pip install numpy scikit-learn
      - name: Download all-period master artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p relationship_in relationship_out
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/13650399622/zip" > relationship_in/master.zip
          test -s relationship_in/master.zip
      - name: Mine all causal relationships
        run: |
          python -m research.hype_false_local_entry.all_local_relationship_atlas \
            --master relationship_in/master.zip \
            --output relationship_out/HYPE_ALL_LOCAL_RELATIONSHIP_ATLAS.json | tee relationship_out/atlas.log
          test -s relationship_out/HYPE_ALL_LOCAL_RELATIONSHIP_ATLAS.json
      - name: Publish atlas
        run: |
          mkdir -p research/hype_false_local_entry/results
          cp relationship_out/HYPE_ALL_LOCAL_RELATIONSHIP_ATLAS.json \
             research/hype_false_local_entry/results/HYPE_ALL_LOCAL_RELATIONSHIP_ATLAS.json
          git config user.name "pandora-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/hype_false_local_entry/results/HYPE_ALL_LOCAL_RELATIONSHIP_ATLAS.json
          git commit -m "research: publish all-local causal relationship atlas [skip ci]" || true
          git pull --rebase origin research/hype-h1-local-v5-oi-microstructure-20261104 || true
          git push origin HEAD:research/hype-h1-local-v5-oi-microstructure-20261104 || true
      - uses: actions/upload-artifact@v4
        with:
          name: HYPE-ALL-LOCAL-RELATIONSHIP-ATLAS-${{ github.run_id }}
          path: relationship_out/**
          retention-days: 30
